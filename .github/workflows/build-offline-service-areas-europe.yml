name: Build offline Europe service areas

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: write

concurrency:
  group: offline-europe-service-areas
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================
  # FASE 1 - ESTRAZIONE
  # Scarica una sola volta il PBF del Paese, estrae le aree di
  # servizio e salva esclusivamente il database leggero CC.json.
  # NON viene più costruito alcun *.graph.json.
  # ============================================================
  extract:
    name: extract (${{ matrix.cc }}, ${{ matrix.slug }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {cc: IT, slug: italy}
          - {cc: FR, slug: france}
          - {cc: DE, slug: germany}
          - {cc: CH, slug: switzerland}
          - {cc: AT, slug: austria}
          - {cc: BE, slug: belgium}
          - {cc: LU, slug: luxembourg}
          - {cc: NL, slug: netherlands}
          - {cc: ES, slug: spain}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install osmium

      - name: Prepare folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .osm
          mkdir -p offline/service_areas

      - name: Download ${{ matrix.cc }}
        shell: bash
        run: |
          set -euo pipefail

          URL="https://download.geofabrik.de/europe/${{ matrix.slug }}-latest.osm.pbf"
          OUT=".osm/${{ matrix.cc }}.osm.pbf"

          echo "Download: $URL"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 30 \
            "$URL" \
            --output "$OUT"

          test -s "$OUT"
          ls -lh "$OUT"

      - name: Extract strict service areas
        shell: bash
        run: |
          set -euo pipefail

          python tools/offline_services/build_service_areas_europe.py \
            "${{ matrix.cc }}" \
            "offline/service_areas/${{ matrix.cc }}.json" \
            ".osm/${{ matrix.cc }}.osm.pbf"

          test -s "offline/service_areas/${{ matrix.cc }}.json"

      - name: Validate country JSON
        shell: bash
        run: |
          set -euo pipefail

          python - "offline/service_areas/${{ matrix.cc }}.json" "${{ matrix.cc }}" <<'PY'
          import json
          import sys

          path, cc = sys.argv[1], sys.argv[2]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("JSON radice non valido")

          if data.get("country") != cc:
              raise SystemExit(
                  f"country non valido: {data.get('country')} != {cc}"
              )

          areas = data.get("areas")
          if not isinstance(areas, list):
              raise SystemExit("Campo areas mancante o non valido")

          if not areas:
              raise SystemExit("Campo areas vuoto")

          if data.get("count") != len(areas):
              raise SystemExit(
                  f"count non coerente: {data.get('count')} != {len(areas)}"
              )

          print("VALID:", path)
          print("country =", cc)
          print("count   =", len(areas))
          PY

      - name: Save country database
        uses: actions/upload-artifact@v4
        with:
          name: service-areas-${{ matrix.cc }}
          path: offline/service_areas/${{ matrix.cc }}.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Cleanup downloaded PBF
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f ".osm/${{ matrix.cc }}.osm.pbf" || true

  # ============================================================
  # FASE 2 - PUBBLICAZIONE
  # Parte dal repository corrente, che contiene gli ultimi JSON
  # validi. Sovrascrive solo i Paesi aggiornati con successo.
  # Se un singolo Paese fallisce, il suo vecchio JSON resta.
  # ============================================================
  publish:
    name: publish databases
    needs: extract
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout current databases
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download completed country databases
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: service-areas-*
          merge-multiple: true
          path: offline/service_areas

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate all country databases before manifest
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          expected = ["IT", "FR", "DE", "CH", "AT", "BE", "LU", "NL", "ES"]
          root = Path("offline/service_areas")

          errors = []

          for cc in expected:
              path = root / f"{cc}.json"

              if not path.exists() or path.stat().st_size == 0:
                  errors.append(f"{cc}: file mancante o vuoto")
                  continue

              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{cc}: JSON non leggibile: {exc}")
                  continue

              if data.get("country") != cc:
                  errors.append(f"{cc}: country non coerente")
                  continue

              areas = data.get("areas")
              if not isinstance(areas, list) or not areas:
                  errors.append(f"{cc}: areas mancante o vuoto")
                  continue

              if data.get("count") != len(areas):
                  errors.append(f"{cc}: count non coerente")
                  continue

              print(f"OK {cc}: {len(areas)} aree")

          if errors:
              print("\nERRORI:")
              for error in errors:
                  print(" -", error)
              raise SystemExit("NON PUBBLICO: database Europa incompleto o non valido")

          print("\nDatabase Paesi validi: 9/9")
          PY

      - name: Remove obsolete graph files
        shell: bash
        run: |
          set -euo pipefail
          find offline/service_areas -maxdepth 1 -type f -name "*.graph.json" -print -delete || true

      - name: Build Europe manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/offline_services/build_europe_manifest.py
          test -s offline/service_areas/manifest_europe.json

      - name: Validate Europe manifest
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          expected = {"IT", "FR", "DE", "CH", "AT", "BE", "LU", "NL", "ES"}
          path = Path("offline/service_areas/manifest_europe.json")

          if not path.exists() or path.stat().st_size == 0:
              raise SystemExit("manifest_europe.json mancante o vuoto")

          data = json.loads(path.read_text(encoding="utf-8"))
          countries = data.get("countries")

          if not isinstance(countries, dict):
              raise SystemExit("Campo countries del manifest non valido")

          found = set(countries.keys())
          missing = sorted(expected - found)

          print("Paesi nel manifest:", ", ".join(sorted(found)))

          if missing:
              raise SystemExit(
                  "NON PUBBLICO: mancano database per: " + ", ".join(missing)
              )

          print("Manifest completo: 9/9 paesi")
          PY

      - name: Show files to publish
        shell: bash
        run: |
          set -euo pipefail
          echo "File offline/service_areas pronti:"
          find offline/service_areas -maxdepth 1 -type f -print | sort

      - name: Commit databases
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A offline/service_areas/

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi

          git commit -m "Update Europe offline service areas"

          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push completato."
              exit 0
            fi

            echo "Push fallito, tentativo $ATTEMPT/3. Riallineo main..."
            git pull --rebase origin main
            sleep 10
          done

          echo "Push fallito dopo 3 tentativi."
          exit 1
