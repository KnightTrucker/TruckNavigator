<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Diario Autista</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
        }

        .overlay {
            background: rgba(0,0,0,0.75);
            min-height: 100vh;
            padding: 20px;
        }

        .header-bar {
            display:flex;
            align-items:center;
            gap:20px;
            margin-bottom:20px;
        }

        .header-bar img {
            height:60px;
            width:auto;
            border-radius:6px;
        }

        .tabs {
            display:flex;
            gap:10px;
            margin-bottom:20px;
        }

        .tab-btn {
            padding:10px 15px;
            border-radius:6px;
            border:none;
            cursor:pointer;
            background:#1e1e1e;
            color:#fff;
        }

        .tab-btn.active {
            background:#2196f3;
        }

        .tab-content {
            display:none;
        }

        .tab-content.active {
            display:block;
        }

        input, select, textarea {
            width:100%;
            padding:8px;
            margin:5px 0 10px 0;
            border-radius:4px;
            border:1px solid #555;
            background:#1e1e1e;
            color:#fff;
        }

        button.primary {
            background:#2196f3;
            color:#fff;
            border:none;
            padding:8px 12px;
            border-radius:4px;
            cursor:pointer;
            margin-right:5px;
        }

        button.secondary {
            background:#607d8b;
            color:#fff;
            border:none;
            padding:6px 10px;
            border-radius:4px;
            cursor:pointer;
            margin-right:5px;
        }

        button.danger {
            background:#f44336;
            color:#fff;
            border:none;
            padding:6px 10px;
            border-radius:4px;
            cursor:pointer;
        }

        table {
            width:100%;
            border-collapse:collapse;
            margin-top:10px;
        }

        th, td {
            border:1px solid #444;
            padding:6px;
            text-align:left;
        }

        th {
            background:#1e1e1e;
        }

        tr:nth-child(even) { background:#181818; }
        tr:nth-child(odd) { background:#202020; }

        .row {
            display:flex;
            flex-wrap:wrap;
            gap:20px;
        }

        .col {
            flex:1 1 300px;
        }

        canvas {
            background:#1e1e1e;
            border-radius:6px;
            margin-top:15px;
        }
    </style>
</head>

                </div>

                <div class="col">
                    <label>Cliente</label>
                    <input type="text" id="c_cliente">

                    <label>Semirimorchio</label>
                    <input type="text" id="c_semirimorchio">

                    <label>Peso (kg)</label>
                    <input type="number" id="c_peso" step="0.1">
                </div>
            </div>

            <button type="button" class="primary" id="btn-add-carico">Salva operazione</button>
            <button type="button" class="secondary" id="btn-reset-carico">Reset</button>
        </form>

        <h3>Elenco carichi / scarichi</h3>

        <table id="table-carichi">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Operazione</th>
                    <th>Luogo</th>
                    <th>Cliente</th>
                    <th>Semirimorchio</th>
                    <th>Peso</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
<!-- TAB RIASSUNTO -->
    <div id="tab-riassunto" class="tab-content">
        <h2>Riassunto</h2>

        <div class="row">
            <div class="col">
                <label>Tipo riassunto</label>
                <select id="r_tipo">
                    <option value="giornaliero">Giornaliero</option>
                    <option value="settimanale">Settimanale</option>
                    <option value="mensile">Mensile</option>
                </select>
            </div>

            <div class="col">
                <label>Data di riferimento</label>
                <input type="date" id="r_data">
            </div>
        </div>

        <button type="button" class="primary" id="btn-calcola-riassunto">Calcola riassunto</button>
        <button type="button" class="secondary" id="btn-stampa-riassunto">Stampa</button>
        <button type="button" class="secondary" id="btn-pdf-riassunto">Esporta PDF (HTML)</button>

        <input 
            type="text" 
            id="search-riassunto" 
            placeholder="Filtra il riassunto..." 
            style="width:100%; padding:10px; margin:15px 0; border-radius:6px; background:#1e1e1e; color:#fff; border:1px solid #555;">

        <div id="summary-output"></div>

        <h3>Grafici</h3>
        <canvas id="graficoKm" height="120"></canvas>
        <canvas id="graficoOre" height="120"></canvas>
        <canvas id="graficoPeso" height="120"></canvas>
    </div>
<!-- TAB IMPORT / EXPORT -->
    <div id="tab-impexp" class="tab-content">
        <h2>Import / Export JSON</h2>

        <button type="button" class="primary" id="btn-export-json">Esporta DIARIO.json</button>

        <div style="margin-top:15px;">
            <input type="file" id="file-import-json" accept=".json">
            <button type="button" class="secondary" id="btn-import-json">Importa DIARIO.json</button>
        </div>
    </div>
<script>
/* -------------------- UTILITÀ -------------------- */

function formatDateIT(dateStr) {
    if (!dateStr) return "";
    const [yyyy, mm, dd] = dateStr.split("-");
    return `${dd}/${mm}/${yyyy}`;
}

function oreToMinuti(str) {
    if (!str) return 0;
    const [h, m] = str.split(":").map(Number);
    return h * 60 + m;
}

function minutiToOre(min) {
    const h = Math.floor(min / 60);
    const m = min % 60;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}

function calcolaIntervallo(start, end) {
    if (!start || !end) return "";
    const m1 = oreToMinuti(start);
    const m2 = oreToMinuti(end);
    let diff = m2 - m1;
    if (diff < 0) diff += 1440;
    return minutiToOre(diff);
}

/* -------------------- STRUTTURA DATI -------------------- */

let DIARIO = {
    giornaliero: [],
    carichi_scarichi: []
};

function saveToLocalStorage() {
    localStorage.setItem("DIARIO_DATA", JSON.stringify(DIARIO));
}

function loadFromLocalStorage() {
    const data = localStorage.getItem("DIARIO_DATA");
    if (data) DIARIO = JSON.parse(data);
}

/* -------------------- TAB SWITCH -------------------- */

document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
    });
});

/* -------------------- CRUD GIORNALIERO -------------------- */

function renderGiornalieroTable() {
    const tbody = document.querySelector("#table-giornaliero tbody");
    tbody.innerHTML = "";

    DIARIO.giornaliero.sort((a,b) => b.data.localeCompare(a.data));

    DIARIO.giornaliero.forEach((rec, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${formatDateIT(rec.data)}</td>
            <td>${rec.trattore}</td>
            <td>${rec.semirimorchio}</td>
            <td>${rec.ora_apertura}</td>
            <td>${rec.ora_chiusura}</td>
            <td>${rec.impegno}</td>
            <td>${rec.km}</td>
            <td>${rec.ore_guida}</td>
            <td>${rec.luogo_sosta}</td>
            <td>${rec.pausa.ore} (${rec.pausa.tipo})</td>
            <td>
                <button class="secondary" onclick="editG(${index})">Modifica</button>
                <button class="danger" onclick="delG(${index})">Cancella</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

document.getElementById("btn-add-giornaliero").addEventListener("click", () => {
    const rec = {
        data: g_data.value,
        trattore: g_trattore.value,
        semirimorchio: g_semirimorchio.value,
        km: g_km.value,
        ora_apertura: g_ora_apertura.value,
        ora_chiusura: g_ora_chiusura.value,
        impegno: calcolaIntervallo(g_ora_apertura.value, g_ora_chiusura.value),
        ore_guida: calcolaIntervallo(g_guida_start.value, g_guida_end.value),
        luogo_sosta: g_luogo_sosta.value,
        pausa: {
            ore: calcolaIntervallo(g_pausa_start.value, g_pausa_end.value),
            tipo: g_pausa_tipo.value
        }
    };

    DIARIO.giornaliero.push(rec);
    saveToLocalStorage();
    renderGiornalieroTable();
    form_giornaliero.reset();
});

function editG(i) {
    const r = DIARIO.giornaliero[i];
    g_data.value = r.data;
    g_trattore.value = r.trattore;
    g_semirimorchio.value = r.semirimorchio;
    g_km.value = r.km;
    g_ora_apertura.value = r.ora_apertura;
    g_ora_chiusura.value = r.ora_chiusura;
    g_guida_start.value = "";
    g_guida_end.value = "";
    g_luogo_sosta.value = r.luogo_sosta;
    g_pausa_start.value = "";
    g_pausa_end.value = "";
    g_pausa_tipo.value = r.pausa.tipo;

    DIARIO.giornaliero.splice(i,1);
    saveToLocalStorage();
    renderGiornalieroTable();
}

function delG(i) {
    DIARIO.giornaliero.splice(i,1);
    saveToLocalStorage();
    renderGiornalieroTable();
}

/* -------------------- CRUD CARICHI -------------------- */

function renderCarichiTable() {
    const tbody = document.querySelector("#table-carichi tbody");
    tbody.innerHTML = "";

    DIARIO.carichi_scarichi.sort((a,b) => b.data.localeCompare(a.data));

    DIARIO.carichi_scarichi.forEach((rec, index) => {
        const colore = rec.operazione === "CARICO" ? "#4caf50" : "#f44336";

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${formatDateIT(rec.data)}</td>
            <td style="color:${colore}; font-weight:bold;">${rec.operazione}</td>
            <td>${rec.luogo}</td>
            <td>${rec.cliente}</td>
            <td>${rec.semirimorchio}</td>
            <td>${rec.peso}</td>
            <td>
                <button class="secondary" onclick="editC(${index})">Modifica</button>
                <button class="danger" onclick="delC(${index})">Cancella</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

document.getElementById("btn-add-carico").addEventListener("click", () => {
    const rec = {
        data: c_data.value,
        operazione: c_operazione.value,
        luogo: c_luogo.value,
        cliente: c_cliente.value,
        semirimorchio: c_semirimorchio.value,
        peso: c_peso.value
    };

    DIARIO.carichi_scarichi.push(rec);
    saveToLocalStorage();
    renderCarichiTable();
    form_carichi.reset();
});

function editC(i) {
    const r = DIARIO.carichi_scarichi[i];
    c_data.value = r.data;
    c_operazione.value = r.operazione;
    c_luogo.value = r.luogo;
    c_cliente.value = r.cliente;
    c_semirimorchio.value = r.semirimorchio;
    c_peso.value = r.peso;

    DIARIO.carichi_scarichi.splice(i,1);
    saveToLocalStorage();
    renderCarichiTable();
}

function delC(i) {
    DIARIO.carichi_scarichi.splice(i,1);
    saveToLocalStorage();
    renderCarichiTable();
}

/* -------------------- RIASSUNTO -------------------- */

document.getElementById("btn-calcola-riassunto").addEventListener("click", () => {
    const tipo = r_tipo.value;
    const dataRef = r_data.value;

    if (!dataRef) {
        alert("Inserisci una data di riferimento.");
        return;
    }

    let lista = [];

    if (tipo === "giornaliero") {
        lista = DIARIO.giornaliero.filter(r => r.data === dataRef);
    }

    if (tipo === "settimanale") {
        const ref = new Date(dataRef);
        const start = new Date(ref);
        start.setDate(ref.getDate() - ref.getDay());
        const end = new Date(start);
        end.setDate(start.getDate() + 6);

        lista = DIARIO.giornaliero.filter(r => {
            const d = new Date(r.data);
            return d >= start && d <= end;
        });
    }

    if (tipo === "mensile") {
        const [yyyy, mm] = dataRef.split("-");
        lista = DIARIO.giornaliero.filter(r => r.data.startsWith(`${yyyy}-${mm}`));
    }

    let totKm = 0;
    let totOreGuida = 0;
    let totImpegno = 0;

    lista.forEach(r => {
        totKm += Number(r.km);
        totOreGuida += oreToMinuti(r.ore_guida);
        totImpegno += oreToMinuti(r.impegno);
    });

    const out = `
        <h3>Risultati</h3>
        <p><b>Totale Km:</b> ${totKm}</p>
        <p><b>Totale ore guida:</b> ${minutiToOre(totOreGuida)}</p>
        <p><b>Totale impegno:</b> ${minutiToOre(totImpegno)}</p>
    `;

    summary_output.innerHTML = out;

    renderGrafici(lista);
});

/* -------------------- GRAFICI -------------------- */

function renderGrafici(lista) {
    const km = lista.map(r => r.km);
    const ore = lista.map(r => oreToMinuti(r.ore_guida));
    const peso = DIARIO.carichi_scarichi.map(r => r.peso);

    new Chart(graficoKm, {
        type: "bar",
        data: {
            labels: lista.map(r => formatDateIT(r.data)),
            datasets: [{
                label: "Km percorsi",
                data: km,
                backgroundColor: "#2196f3"
            }]
        }
    });

    new Chart(graficoOre, {
        type: "line",
        data: {
            labels: lista.map(r => formatDateIT(r.data)),
            datasets: [{
                label: "Ore guida (minuti)",
                data: ore,
                borderColor: "#4caf50"
            }]
        }
    });

    new Chart(graficoPeso, {
        type: "bar",
        data: {
            labels: DIARIO.carichi_scarichi.map(r => formatDateIT(r.data)),
            datasets: [{
                label: "Peso (kg)",
                data: peso,
                backgroundColor: "#f44336"
            }]
        }
    });
}

/* -------------------- IMPORT / EXPORT -------------------- */

document.getElementById("btn-export-json").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(DIARIO, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "DIARIO.json";
    a.click();
});

document.getElementById("btn-import-json").addEventListener("click", () => {
    const file = file_import_json.files[0];
    if (!file) {
        alert("Seleziona un file JSON.");
        return;
    }

    const reader = new FileReader();
    reader.onload = e => {
        try {
            DIARIO = JSON.parse(e.target.result);
            saveToLocalStorage();
            renderGiornalieroTable();
            renderCarichiTable();
            alert("Import completato.");
        } catch {
            alert("Errore nel file JSON.");
        }
    };
    reader.readAsText(file);
});

/* -------------------- INIT -------------------- */

function initApp() {
    loadFromLocalStorage();
    renderGiornalieroTable();
    renderCarichiTable();
}

initApp();
</script>
</div> <!-- fine overlay -->
</body>
</html>
