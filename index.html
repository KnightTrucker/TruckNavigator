<head>

<title>GATTO 2.0 CLEAN CORE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--green:#25d16f;--panel:rgba(5,13,22,.94);--muted:#a9b6ca}
*{box-sizing:border-box}
html,body,#map{width:100%;height:100%;margin:0;background:#09131c;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
#map{position:fixed;inset:0}
.leaflet-control-attribution{font-size:9px;background:rgba(0,0,0,.45)!important;color:#bbb!important}
.leaflet-control-attribution a{color:#ddd!important}
#top{
 position:fixed;z-index:1000;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));
 min-height:158px;border:3px solid var(--green);border-radius:22px;background:var(--panel);
 display:grid;grid-template-columns:150px 1fr;overflow:hidden;box-shadow:0 8px 28px #0009
}
#maneuverBox{border-right:2px solid var(--green);padding:8px 8px 6px;text-align:center;display:flex;flex-direction:column;justify-content:space-between}
#turnDistance{font-size:45px;font-weight:950;line-height:1}
#turnArrow{font-size:48px;font-weight:900;line-height:1}
#turnTime{font-size:22px;font-weight:800;color:#ffd34f}
#turnInfo{padding:20px 24px;display:flex;flex-direction:column;justify-content:center;min-width:0}
#turnRoad{font-size:29px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#turnInstruction{font-size:20px;font-weight:800;color:var(--muted);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#speed{
 position:fixed;z-index:1000;right:198px;top:244px;width:90px;height:90px;border:1px solid #42516a;border-radius:20px;
 background:rgba(5,13,22,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 18px #0008
}
#speedValue{font-size:42px;font-weight:950;line-height:1}
#speedUnit{font-size:11px;font-weight:800;color:#9daac0;margin-top:7px}
#gps{
 position:fixed;z-index:1000;left:18px;bottom:18px;padding:10px 13px;border-radius:14px;
 background:rgba(5,13,22,.82);border:1px solid #435168;font-size:12px;color:#b9c5d7
}
#version{
 position:fixed;z-index:1000;right:18px;bottom:18px;padding:8px 11px;border-radius:12px;
 background:rgba(5,13,22,.78);border:1px solid #325344;color:#8cf0b5;font-size:11px;font-weight:800
}
#message{
 position:fixed;z-index:1200;left:50%;bottom:90px;transform:translateX(-50%);max-width:88vw;
 padding:12px 16px;border-radius:14px;background:#101b2a;border:1px solid #4c5b73;display:none;text-align:center;font-weight:800
}
.cat-icon{width:74px;height:74px;border-radius:50%;border:5px solid #e8f2ff;background:#5597c9;box-shadow:0 0 0 4px #4b89bb,0 8px 18px #0008;overflow:hidden}
.cat-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%}
@media(max-width:520px){
 #top{grid-template-columns:135px 1fr;min-height:158px}
 #turnDistance{font-size:42px}
 #turnRoad{font-size:27px}
 #turnInstruction{font-size:18px}
 #speed{right:186px;top:244px;width:88px;height:88px}
}
</style>
</head>

const CFG={
  toLat:Number(Q.get('toLat')),
  toLng:Number(Q.get('toLng')),
  toName:Q.get('toName')||'Destinazione',
  alt:Number(Q.get('alt'))||4.0,
  lar:Number(Q.get('lar'))||2.55,
  lun:Number(Q.get('lun'))||18.75,
  pes:Number(Q.get('pes'))||40,

};

let map,routeLayer=null,catMarker=null,watchId=null;
let routeCoords=[],steps=[],cumDist=[],totalMeters=0;
let lastRaw=null,lastMatched=null,lastRouteIndex=0;
let routeBusy=false,routeReady=false;
let lastGpsAt=0,lastVisual=null,animFrame=0;

function $(id){return document.getElementById(id)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function validDestination(){return Number.isFinite(CFG.toLat)&&Number.isFinite(CFG.toLng)}
function hav(a,b){
  const R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,
  dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function fmtDist(m){
  if(!Number.isFinite(m))return'--';
  if(m<1000)return Math.max(10,Math.round(m/10)*10)+' m';
  return (m/1000).toFixed(m<10000?1:0)+' km';
}
function showMessage(t,ms=3500){
  const e=$('message');e.textContent=t;e.style.display='block';
  clearTimeout(showMessage._t);showMessage._t=setTimeout(()=>e.style.display='none',ms);
}
function initMap(){
  map=L.map('map',{zoomControl:false,attributionControl:true,center:[45.5,10.5],zoom:15});
  L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{
    maxZoom:20,subdomains:'0123',attribution:'© Google Maps'
  }).addTo(map);
}
function catIcon(){
  return L.divIcon({
    className:'',
    html:'<div class="cat-icon"><img src="'+MASCOT+'" alt="Posizione"></div>',
    iconSize:[74,74],iconAnchor:[37,37]
  });
}
function createOrMoveCat(pos){
  if(!catMarker){
    catMarker=L.marker([pos.lat,pos.lng],{icon:catIcon(),zIndexOffset:2000,interactive:false}).addTo(map);
    lastVisual={lat:pos.lat,lng:pos.lng};
    return;
  }
  animateCat(pos);
}
function animateCat(target){
  cancelAnimationFrame(animFrame);
  const from=lastVisual||target;
  const jump=hav(from,target);
  if(jump>180){
    catMarker.setLatLng([target.lat,target.lng]);lastVisual={...target};return;
  }
  const start=performance.now(),dur=700;
  function frame(now){
    const t=clamp((now-start)/dur,0,1),e=1-Math.pow(1-t,3);
    const p={lat:from.lat+(target.lat-from.lat)*e,lng:from.lng+(target.lng-from.lng)*e};
    catMarker.setLatLng([p.lat,p.lng]);lastVisual=p;
    if(t<1)animFrame=requestAnimationFrame(frame);
  }
  animFrame=requestAnimationFrame(frame);
}
function nearestRouteIndex(pos){
  if(routeCoords.length<2)return{idx:0,dist:Infinity};
  let start=Math.max(0,lastRouteIndex-80),end=Math.min(routeCoords.length-1,lastRouteIndex+500);
  let best=Infinity,bi=lastRouteIndex;
  for(let i=start;i<=end;i++){
    const d=hav(pos,routeCoords[i]);if(d<best){best=d;bi=i}
  }
  if(best>250){
    for(let i=0;i<routeCoords.length;i+=4){
      const d=hav(pos,routeCoords[i]);if(d<best){best=d;bi=i}
    }
  }
  return{idx:bi,dist:best};
}
function matchPosition(raw){
  if(!routeReady)return{pos:raw,idx:0,dist:Infinity};
  const n=nearestRouteIndex(raw);
  if(n.dist<=70){
    lastRouteIndex=Math.max(lastRouteIndex,n.idx);
    return{pos:routeCoords[lastRouteIndex],idx:lastRouteIndex,dist:n.dist};
  }
  return{pos:raw,idx:lastRouteIndex,dist:n.dist};
}
function currentStep(idx){
  for(let i=0;i<steps.length;i++){
    const wp=steps[i].way_points||[];
    if(wp.length>1&&idx<=wp[1])return steps[i];
  }
  return steps[steps.length-1]||null;
}
function arrowFor(type){
  const n=Number(type);
  if([0,1,6,7].includes(n))return'↖';
  if([2,3,8,9].includes(n))return'↗';
  if([4,10].includes(n))return'←';
  if([5,11].includes(n))return'→';
  if([12,13].includes(n))return'↻';
  return'↑';
}
function roadName(step){
  return String(step?.name||step?.instruction||CFG.toName||'Percorso').trim();
}
function updateTop(idx){
  if(!routeReady){
    $('turnDistance').textContent='--';
    $('turnArrow').textContent='↑';
    $('turnTime').textContent='';
    $('turnRoad').textContent='NAVIGATORE LIBERO';
    $('turnInstruction').textContent=lastRaw?'Posizione GPS attiva':'GPS in attesa…';
    return;
  }
  const st=currentStep(idx);
  if(!st)return;
  const wp=st.way_points||[idx,idx];
  const end=Math.min(routeCoords.length-1,Number(wp[1])||idx);
  const m=Math.max(0,(cumDist[end]||0)-(cumDist[idx]||0));
  $('turnDistance').textContent=fmtDist(m);
  $('turnArrow').textContent=arrowFor(st.type);
  $('turnRoad').textContent=roadName(st).toUpperCase();
  $('turnInstruction').textContent=String(st.instruction||'Prosegui');
  const speed=Math.max(35,Number($('speedValue').textContent)||70);
  const mins=Math.round((m/1000)/speed*60);
  $('turnTime').textContent=m>500?'Tempo '+String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0'):'';
}
function followCamera(pos,idx){
  let target=pos;
  if(routeReady&&routeCoords.length){
    const ahead=Math.min(routeCoords.length-1,idx+Math.max(8,Math.round((Number($('speedValue').textContent)||0)/6)));
    target=routeCoords[ahead]||pos;
  }
  map.panTo([target.lat,target.lng],{animate:true,duration:.65,easeLinearity:.35,noMoveStart:true});
}
async function requestRoute(start){
  if(!validDestination()||routeBusy)return;
  routeBusy=true;
  $('turnRoad').textContent='CALCOLO PERCORSO…';
  $('turnInstruction').textContent='Navigazione HGV';
  try{
    const body={
      coordinates:[[start.lng,start.lat],[CFG.toLng,CFG.toLat]],
      instructions:true,instructions_format:'text',language:'it',
      elevation:false,preference:CFG.pref,
      options:{profile_params:{restrictions:{
        height:CFG.alt,width:CFG.lar,length:CFG.lun,weight:CFG.pes,axleload:CFG.ass
      }}}
    };
    const r=await fetch('https://api.openrouteservice.org/v2/directions/driving-hgv/geojson',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':ORS_KEY},body:JSON.stringify(body)
    });
    if(!r.ok)throw new Error('Routing HTTP '+r.status);
    const data=await r.json(),feat=data.features&&data.features[0];
    if(!feat)throw new Error('Percorso non disponibile');
    applyRoute(feat);
  }catch(e){
    routeReady=false;showMessage('Errore percorso: '+e.message,5000);updateTop(0);
  }finally{routeBusy=false}
}
function applyRoute(feat){
  routeCoords=feat.geometry.coordinates.map(c=>({lat:c[1],lng:c[0]}));
  steps=[];
  (feat.properties?.segments||[]).forEach(seg=>(seg.steps||[]).forEach(st=>steps.push(st)));
  cumDist=[0];
  for(let i=1;i<routeCoords.length;i++)cumDist[i]=cumDist[i-1]+hav(routeCoords[i-1],routeCoords[i]);
  totalMeters=cumDist[cumDist.length-1]||0;
  lastRouteIndex=0;routeReady=routeCoords.length>1;
  if(routeLayer)map.removeLayer(routeLayer);
  routeLayer=L.polyline(routeCoords,{color:'#198cff',weight:7,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(map);
  if(lastRaw){
    const n=nearestRouteIndex(lastRaw);lastRouteIndex=n.idx;updateTop(n.idx);
  }else updateTop(0);
}
function onGps(p){
  const raw={lat:p.coords.latitude,lng:p.coords.longitude};
  const acc=Math.round(p.coords.accuracy||0);
  const speed=Number.isFinite(p.coords.speed)?Math.max(0,p.coords.speed*3.6):0;
  lastRaw=raw;lastGpsAt=Date.now();
  $('speedValue').textContent=String(Math.round(speed));
  $('gps').textContent='GPS: ±'+acc+' m';
  const matched=matchPosition(raw);
  lastMatched=matched.pos;
  createOrMoveCat(matched.pos);
  followCamera(matched.pos,matched.idx);
  updateTop(matched.idx);
  if(validDestination()&&!routeReady&&!routeBusy)requestRoute(raw);
}
function onGpsError(e){
  $('gps').textContent='GPS: errore';
  showMessage(e.code===1?'Permesso GPS negato':'Segnale GPS non disponibile',4500);
}
function startGps(){
  if(!navigator.geolocation){showMessage('GPS non supportato');return}
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(onGps,onGpsError,{
    enableHighAccuracy:true,maximumAge:1000,timeout:20000
  });
}
function startApp(){
  initMap();updateTop(0);startGps();
}
window.addEventListener('load',startApp);
</script>
