name: Build offline Europe service areas
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"
permissions:
  contents: write
concurrency:
  group: offline-europe-service-areas
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install osmium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip osmium
      - name: Build seven countries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf offline/service_areas.new .osm-services
          mkdir -p offline/service_areas.new .osm-services
          build_country(){
            CC="$1"; SLUG="$2"; P=".osm-services/${CC}.osm.pbf"; J="offline/service_areas.new/${CC}.json"
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 30 -o "$P" "https://download.geofabrik.de/europe/${SLUG}-latest.osm.pbf"
            test -s "$P"
            .venv/bin/python tools/offline_services/build_service_areas_europe.py "$CC" "$P" "$J"
            .venv/bin/python - "$J" "$CC" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'));cc=sys.argv[2];a=d.get('areas')
          if d.get('country')!=cc or not isinstance(a,list) or not a or d.get('count')!=len(a):raise SystemExit(f'invalid {cc}')
          print(cc,len(a))
          PY
            rm -f "$P"
          }
          build_country IT italy
          build_country FR france
          build_country DE germany
          build_country CH switzerland
          build_country AT austria
          build_country BE belgium
          build_country LU luxembourg
      - name: Build single manifest and publish atomically
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python tools/offline_services/build_europe_manifest.py offline/service_areas.new
          test -s offline/service_areas.new/manifest.json
          rm -rf offline/service_areas
          mv offline/service_areas.new offline/service_areas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A offline/service_areas
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update seven-country offline service areas"
          for A in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; sleep 10; done
          exit 1
