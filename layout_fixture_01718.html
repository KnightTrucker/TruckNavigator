<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#10131b;--s1:#1b1f2b;--s2:#242938;--bd:#343a50;--acc:#e84042;--txt:#f2f3f7;--mut:#9aa3b7;--grn:#22c55e;--blu:#4f9ef8;--amber:#f59e0b;--ff:"Inter",system-ui,sans-serif;--fd:"Rajdhani",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--ff)}
#map{position:fixed;inset:0;background:#151925}.leaflet-control-attribution{font-size:9px}
.topbar{position:fixed;z-index:900;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(180deg,rgba(16,19,27,.98),rgba(16,19,27,.90));border-bottom:1px solid var(--bd)}
.turnbox{display:grid;grid-template-columns:66px 1fr auto;gap:10px;align-items:center;min-height:108px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.turnicon{font:700 54px/1 var(--fd);text-align:center;color:#fff}.turnmain{min-width:0}.turn-distance{font:700 32px/1 var(--fd);color:#fff}.turn-instruction{font:600 17px/1.25 var(--ff);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.turn-road{font-size:11px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voice{width:38px;height:38px;border:1px solid var(--bd);border-radius:50%;background:var(--s2);color:#fff;font-size:18px;display:grid;place-items:center}
.voice-stack{display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center}
.voice.mic{border-color:#4f9ef8}
.voice.mic.listening{border-color:#ef4444;background:rgba(127,29,29,.95);box-shadow:0 0 0 5px rgba(239,68,68,.16)}
.voice-command-panel{position:fixed;z-index:2700;top:126px;right:10px;width:min(86vw,310px);display:none;background:rgba(13,16,23,.985);border:1px solid var(--bd);border-radius:11px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
.voice-command-panel.open{display:block}
.voice-command-heard{font:700 11px var(--ff);color:#8ec5ff;background:#10141d;border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:7px}
.voice-command-result{font:600 10px var(--ff);color:var(--mut);line-height:1.4}
.voice-command-help{margin-top:7px;font:600 9px var(--ff);color:var(--mut);line-height:1.5}
.status{position:fixed;z-index:900;bottom:calc(12px + env(safe-area-inset-bottom));left:10px;right:10px;background:rgba(27,31,43,.96);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.45);overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}.stat{padding:9px 6px;text-align:center;border-right:1px solid var(--bd)}.stat:last-child{border-right:0}.val{font:700 20px/1 var(--fd)}.lbl{font-size:9px;text-transform:uppercase;color:var(--mut);margin-top:3px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));border-top:1px solid var(--bd)}.actions button{border:0;border-right:1px solid var(--bd);background:var(--s2);color:var(--txt);padding:10px 6px;font:600 12px var(--ff)}.actions button:last-child{border-right:0}.actions .stop{color:#ff8b8d}
.gpsbadge{position:fixed;z-index:850;top:128px;right:10px;background:rgba(16,19,27,.92);border:1px solid var(--bd);border-radius:10px;padding:7px 9px;font-size:11px;color:var(--mut)}.gpsbadge.ok{color:#9be5ae;border-color:#315c3d}.gpsbadge.bad{color:#ffb1b2;border-color:#6b3435}
.centerbtn{position:fixed;z-index:850;right:12px;bottom:150px;width:46px;height:46px;border-radius:50%;border:1px solid var(--bd);background:rgba(27,31,43,.96);color:#fff;font-size:20px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.loading{position:fixed;z-index:2000;inset:0;background:rgba(10,12,18,.91);display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}.loading-card{max-width:360px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:22px}.loading-title{font:700 24px var(--fd);margin-bottom:8px}.loading-msg{color:var(--mut);font-size:13px;line-height:1.45}.startbtn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:700 16px var(--ff)}
.route-info{position:fixed;z-index:850;top:128px;left:10px;max-width:55%;background:rgba(16,19,27,.90);border:1px solid var(--bd);border-radius:10px;padding:7px 9px;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.truck-marker{width:34px;height:34px;border-radius:50%;background:rgba(16,19,27,.88);border:2px solid #fff;box-shadow:0 0 0 4px rgba(79,158,248,.28),0 3px 10px rgba(0,0,0,.55);display:grid;place-items:center;transform-origin:center;overflow:hidden}.truck-marker .nav-mascot{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%}
.toast{position:fixed;z-index:3000;left:14px;right:14px;bottom:210px;padding:11px 13px;border-radius:10px;background:#191d29;border:1px solid var(--bd);border-left:3px solid var(--acc);text-align:center;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.next-turn{position:fixed;z-index:880;top:130px;left:50%;transform:translateX(-50%);max-width:48%;background:rgba(27,31,43,.94);border:1px solid var(--bd);border-radius:9px;padding:6px 10px;text-align:center;box-shadow:0 5px 16px rgba(0,0,0,.3)}
.next-turn .nlabel{font-size:8px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}.next-turn .ntext{font:600 11px var(--ff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.gps-quality{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ef4444;margin-right:5px}.gps-quality.mid{background:#f59e0b}.gps-quality.good{background:#22c55e}
.wakebadge{position:fixed;z-index:850;right:12px;bottom:205px;background:rgba(27,31,43,.94);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:10px;color:var(--mut)}
.stopbadge{position:fixed;z-index:850;left:12px;bottom:205px;background:rgba(27,31,43,.94);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:10px;color:var(--mut);max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{grid-template-columns:repeat(4,1fr)}
.road-now{position:fixed;z-index:870;left:50%;transform:translateX(-50%);bottom:168px;max-width:70%;background:rgba(18,20,28,.9);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font:600 11px var(--ff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maneuver-list{position:fixed;z-index:860;left:12px;top:188px;width:min(46%,280px);background:rgba(27,31,43,.95);border:1px solid var(--bd);border-radius:10px;padding:8px 9px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.maneuver-list h4{font:700 9px var(--ff);text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:5px}
.maneuver-item{font:600 10px var(--ff);padding:5px 0;border-top:1px solid rgba(48,53,79,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maneuver-item:first-of-type{border-top:none}
.pref-panel{position:fixed;z-index:860;right:12px;top:188px;width:min(42%,220px);background:rgba(27,31,43,.95);border:1px solid var(--bd);border-radius:10px;padding:8px 9px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.pref-panel h4{font:700 9px var(--ff);text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:5px}
.pref-panel label{display:flex;gap:6px;align-items:center;font:600 10px var(--ff);margin:4px 0}
.avoid-btn{width:100%;margin-top:6px;padding:6px 8px;border-radius:7px;border:1px solid var(--bd);background:var(--s2);color:var(--txt);font:600 10px var(--ff)}
.hwy-mode .maneuver-list,.hwy-mode .pref-panel,.hwy-mode .next-turn{opacity:.16;transition:opacity .2s}
.hwy-mode .maneuver-list:hover,.hwy-mode .pref-panel:hover,.hwy-mode .next-turn:hover{opacity:1}
.hwy-banner{position:fixed;z-index:845;left:50%;transform:translateX(-50%);bottom:205px;background:rgba(18,20,28,.92);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font:600 10px var(--ff);display:none}
.hwy-mode .hwy-banner{display:block}
.eta-dyn{position:fixed;z-index:850;right:12px;bottom:168px;background:rgba(18,20,28,.92);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;font:600 10px var(--ff)}
.restrict-ahead{position:fixed;z-index:1800;left:50%;transform:translateX(-50%);top:245px;width:min(92%,540px);pointer-events:none}
.restrict-ahead .ra{background:rgba(120,53,15,.96);border:2px solid #f59e0b;color:#fff;border-radius:10px;padding:9px 11px;margin-top:5px;box-shadow:0 6px 20px rgba(0,0,0,.35);font:600 12px var(--ff)}
.route-check{position:fixed;z-index:1850;left:50%;transform:translateX(-50%);top:82px;width:min(92%,560px);background:rgba(18,20,28,.96);border:1px solid var(--bd);border-radius:11px;padding:9px 11px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.route-check-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.route-light{width:13px;height:13px;border-radius:50%;background:#6b7280;box-shadow:0 0 8px rgba(255,255,255,.2)}
.route-light.green{background:#22c55e}.route-light.yellow{background:#f59e0b}.route-light.red{background:#ef4444}
.route-check-title{font:700 11px var(--ff);flex:1}.route-check-sub{font:500 9px var(--ff);color:var(--mut);margin-top:3px}
.drive-clean .maneuver-list,.drive-clean .pref-panel,.drive-clean .next-turn,.drive-clean .wakebadge,.drive-clean .stopbadge{opacity:.12;transition:opacity .2s}
.drive-clean .maneuver-list:hover,.drive-clean .pref-panel:hover,.drive-clean .next-turn:hover{opacity:1}
.clean-toggle{position:fixed;z-index:880;right:12px;bottom:238px;background:rgba(27,31,43,.94);border:1px solid var(--bd);color:var(--txt);border-radius:8px;padding:6px 8px;font:600 10px var(--ff)}
.truck-services{position:fixed;z-index:910;left:12px;bottom:238px;width:min(48%,300px);background:rgba(27,31,43,.96);border:1px solid var(--bd);border-radius:10px;padding:8px 9px;box-shadow:0 8px 22px rgba(0,0,0,.38)}
.truck-services h4{font:700 9px var(--ff);text-transform:uppercase;color:var(--mut);letter-spacing:.6px;margin-bottom:6px}
.svc-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.svc-tabs button{padding:6px 4px;border:1px solid var(--bd);border-radius:7px;background:var(--s2);color:var(--txt);font-size:13px}
.svc-tabs button.on{border-color:#22c55e;color:#4ade80}
.svc-list{max-height:160px;overflow:auto;margin-top:6px}.svc-item{border-top:1px solid rgba(48,53,79,.55);padding:6px 0}.svc-item:first-child{border-top:none}
.svc-name{font:600 10px var(--ff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.svc-meta{font:500 9px var(--ff);color:var(--mut);margin:2px 0 4px}
.svc-actions{display:flex;gap:4px}.svc-actions button{flex:1;padding:5px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--txt);font:600 9px var(--ff)}
.svc-actions button.go{border-color:#22c55e;color:#4ade80}
.nav-clean-mode .next-turn,
.nav-clean-mode .maneuver-list,
.nav-clean-mode .pref-panel,
.nav-clean-mode .truck-services,
.nav-clean-mode .route-check,
.nav-clean-mode .restrict-ahead,
.nav-clean-mode .hwy-banner,
.nav-clean-mode .wakebadge,
.nav-clean-mode .stopbadge,
.nav-clean-mode .road-now,
.nav-clean-mode .eta-dyn,
.nav-clean-mode .clean-toggle,
.nav-clean-mode .night-toggle{
  display:none!important;
}
.nav-clean-mode .topbar{
  min-height:92px!important;
  padding:10px 12px!important;
  background:rgba(14,17,24,.94)!important;
  backdrop-filter:blur(8px);
}
.nav-clean-mode .turnpanel{
  width:100%!important;
  max-width:none!important;
  margin:0!important;
  padding:0!important;
  background:transparent!important;
  border:none!important;
  box-shadow:none!important;
}
.nav-clean-mode #turnIcon{
  font-size:34px!important;
  min-width:46px!important;
}
.nav-clean-mode #turnDistance{
  font-size:30px!important;
  line-height:1!important;
}
.nav-clean-mode #turnInstruction{
  font-size:17px!important;
  line-height:1.15!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
}
.nav-clean-mode #turnRoad{
  font-size:11px!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
}
.nav-clean-mode .bottom{
  left:10px!important;right:10px!important;bottom:10px!important;
  width:auto!important;
  background:rgba(14,17,24,.94)!important;
  border:1px solid var(--bd)!important;
  border-radius:12px!important;
  box-shadow:0 8px 24px rgba(0,0,0,.42)!important;
}
.nav-clean-mode .tripbar{
  display:grid!important;
  grid-template-columns:repeat(3,1fr)!important;
  gap:6px!important;
  padding:8px 10px!important;
}
.nav-clean-mode .tripbar .tb:nth-child(4){display:none!important}

.nav-clean-mode .actions{
  grid-template-columns:repeat(3,1fr)!important;
  padding:6px 8px 8px!important;
}
.nav-clean-mode .actions #skipStopBtn{display:none!important}
.nav-clean-mode .gpsbadge{
  top:auto!important;
  bottom:138px!important;
  right:10px!important;
  left:auto!important;
  font-size:10px!important;
  padding:5px 7px!important;
  opacity:.86;
}
.nav-clean-mode .svc-toggle-mini{
  display:block!important;
}
.svc-toggle-mini{
  position:fixed;z-index:1650;left:10px;bottom:138px;
  border:1px solid var(--bd);border-radius:9px;
  background:rgba(27,31,43,.94);color:var(--txt);
  padding:7px 10px;font:600 10px var(--ff);display:none;
}
.service-sheet{
  position:fixed;z-index:2000;left:10px;right:10px;bottom:76px;
  max-height:45vh;overflow:auto;
  background:rgba(20,23,32,.98);border:1px solid var(--bd);
  border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  display:none;
}
.service-sheet.open{display:block}
.service-sheet .truck-services{
  position:static!important;width:auto!important;max-width:none!important;
  display:block!important;background:transparent!important;border:none!important;
  box-shadow:none!important;padding:0!important;
}
@media(max-width:430px){.turnbox{grid-template-columns:56px 1fr 40px}.turnicon{font-size:42px}.turn-distance{font-size:25px}.turn-instruction{font-size:14px}.stats{grid-template-columns:repeat(4,1fr)}.val{font-size:18px}}

.hide-nav-btn{position:fixed;z-index:2100;right:10px;top:10px;border:1px solid var(--bd);border-radius:9px;background:rgba(27,31,43,.95);color:var(--txt);padding:7px 10px;font:700 10px var(--ff);box-shadow:0 5px 16px rgba(0,0,0,.3)}

.nav-ultra-clean .hide-nav-btn{display:block!important;opacity:.78}


/* === NAVY v13 === */
.exit-card{
  position:fixed;z-index:1950;left:50%;transform:translateX(-50%);
  top:98px;width:min(92%,520px);display:none;
  background:rgba(13,55,36,.97);border:2px solid #22c55e;color:#fff;
  border-radius:12px;padding:10px 13px;box-shadow:0 8px 24px rgba(0,0,0,.42)
}
.exit-card.show{display:block}
.exit-card .exit-kicker{font:700 9px var(--ff);text-transform:uppercase;letter-spacing:.7px;opacity:.8}
.exit-card .exit-main{display:flex;align-items:center;gap:10px;margin-top:3px}
.exit-card .exit-icon{font-size:30px}
.exit-card .exit-distance{font:700 25px var(--fd);white-space:nowrap}
.exit-card .exit-text{font:700 14px var(--ff);overflow:hidden;text-overflow:ellipsis}
.drive-timer{
  position:fixed;z-index:1650;right:10px;bottom:172px;
  background:rgba(20,23,32,.94);border:1px solid var(--bd);border-radius:9px;
  padding:6px 8px;font:600 10px var(--ff);color:var(--mut)
}
.drive-timer strong{color:var(--txt);font-family:var(--fm)}
.drive-timer.warn{border-color:#f59e0b;color:#fbbf24}
.drive-timer.danger{border-color:#ef4444;color:#f87171}
.break-settings{
  position:fixed;z-index:2200;right:10px;bottom:210px;width:230px;display:none;
  background:rgba(20,23,32,.98);border:1px solid var(--bd);border-radius:11px;
  padding:10px;box-shadow:0 10px 26px rgba(0,0,0,.48)
}
.break-settings.open{display:block}
.break-settings label{display:block;font:600 9px var(--ff);color:var(--mut);margin:5px 0 3px}
.break-settings input{width:100%;padding:6px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--txt)}
.break-settings button{width:100%;margin-top:7px;padding:6px;border-radius:7px;border:1px solid var(--bd);background:var(--s2);color:var(--txt)}
.offline-badge{
  position:fixed;z-index:1750;left:10px;top:10px;display:none;
  padding:6px 9px;border-radius:8px;background:rgba(120,53,15,.96);
  border:1px solid #f59e0b;color:#fff;font:700 10px var(--ff)
}
.offline-badge.show{display:block}
.eta-smart{
  position:fixed;z-index:1650;left:10px;bottom:172px;
  background:rgba(20,23,32,.94);border:1px solid var(--bd);border-radius:9px;
  padding:6px 8px;font:600 10px var(--ff)
}
.nav-ultra-clean .drive-timer,.nav-ultra-clean .break-settings,.nav-ultra-clean .eta-smart{display:none!important}
.nav-ultra-clean .exit-card{display:none!important}
@media(max-width:430px){
  .exit-card{top:84px}
  .drive-timer{right:8px;bottom:160px}
  .eta-smart{left:8px;bottom:160px}
}


/* === v13.1 FIX SERVIZI === */
.service-sheet{
  position:fixed!important;
  z-index:2400!important;
  left:10px!important;
  right:10px!important;
  bottom:72px!important;
  max-height:52vh!important;
  overflow:auto!important;
  background:rgba(17,20,29,.98)!important;
  border:1px solid var(--bd)!important;
  border-radius:14px!important;
  padding:10px!important;
  box-shadow:0 14px 36px rgba(0,0,0,.58)!important;

}
.service-sheet.open{display:block!important}
.nav-clean-mode .service-sheet.open{display:block!important}
.nav-clean-mode .service-sheet.open .truck-services,
.service-sheet.open .truck-services{
  display:block!important;
  position:static!important;
  width:100%!important;
  max-width:none!important;
  background:transparent!important;
  border:none!important;
  box-shadow:none!important;
  padding:0!important;

}

.nav-ultra-clean .svc-toggle-mini,
.nav-ultra-clean .service-sheet,
.nav-ultra-clean .service-sheet.open,
.nav-ultra-clean .service-sheet.open .truck-services{
  display:none!important;
}
.service-sheet .svc-tabs{display:grid!important}
.service-sheet .svc-list{display:block!important;max-height:34vh!important;overflow:auto!important}


/* === NAVY v14: unified navigation menu === */
.svc-toggle-mini{display:none!important}
.nav-menu-btn{display:none!important}
.nav-menu-sheet{
  position:fixed;z-index:2450;left:10px;right:10px;bottom:72px;
  max-height:58vh;overflow:auto;display:none;
  background:rgba(16,19,27,.985);border:1px solid var(--bd);
  border-radius:14px;padding:10px;box-shadow:0 16px 38px rgba(0,0,0,.6)

.nav-menu-sheet.open{display:block}
.nav-menu-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px}

  background:var(--s2);color:var(--mut);font:700 10px var(--ff)

.nav-menu-tabs button.on{border-color:#22c55e;color:#4ade80;background:rgba(34,197,94,.1)}
.nav-menu-pane{display:none}
.nav-menu-pane.on{display:block}
.nav-menu-sheet .truck-services{
  display:block!important;position:static!important;width:100%!important;
  max-width:none!important;background:transparent!important;border:none!important;
  box-shadow:none!important;padding:0!important;opacity:1!important
}
.nav-settings-block{padding:4px 2px}
.nav-settings-block h4{font:700 10px var(--ff);text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:8px 0 5px}
.nav-setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4px;border-top:1px solid rgba(48,53,79,.55)}
.nav-setting-row:first-of-type{border-top:none}
.nav-setting-row label{font:600 11px var(--ff);color:var(--txt)}
.nav-setting-row input[type=checkbox]{width:18px;height:18px}
