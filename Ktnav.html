<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#12141C;--s1:#1B1E2B;--s2:#242839;--bd:#30354F;
  --acc:#E84042;--txt:#E2E4EC;--mut:#8892AA;--grn:#22c55e;--r:8px;
  --ff:'Inter',system-ui,sans-serif;--fd:'Rajdhani',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--ff);background:var(--bg);color:var(--txt);font-size:14px}
.layout{display:flex;flex-direction:column;height:100vh}

/* Header */
.hdr{flex-shrink:0;background:var(--s1);border-bottom:1px solid var(--bd);
  padding:0 14px;height:52px;display:flex;align-items:center;gap:10px;z-index:20}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand img{width:36px;height:36px;border-radius:6px;object-fit:contain}
.brand-name{font:700 18px var(--fd);letter-spacing:.5px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--r);
  border:none;cursor:pointer;font:600 13px var(--ff);transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--acc);color:#fff}.btn-primary:hover{background:#c23034}
.btn-ghost{background:var(--s2);color:var(--txt);border:1px solid var(--bd)}.btn-ghost:hover{background:var(--bd)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{width:36px;height:36px;padding:0;justify-content:center;flex-shrink:0;font-size:16px}

/* Map */
#map{width:100%;height:100%;background:#1a1d2a}

/* Bottom panel */
.panel{flex-shrink:0;background:var(--s1);border-top:2px solid var(--acc);overflow-y:auto;max-height:55vh}
.panel-inner{padding:12px 14px 80px}

/* Address inputs */
.addr-group{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.addr-row{display:flex;gap:6px;align-items:stretch}
.addr-label{font:700 9px var(--ff);letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.addr-input{flex:1;background:var(--bg);border:1.5px solid var(--bd);border-radius:var(--r);
  color:var(--txt);font:13px var(--ff);padding:9px 11px;min-width:0;transition:border-color .15s}
.addr-input:focus{outline:none;border-color:var(--acc)}
.addr-input::placeholder{color:var(--mut)}
.addr-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:13px}
.dot-from{background:var(--grn);box-shadow:0 0 6px var(--grn)}
.dot-to{background:var(--acc);box-shadow:0 0 6px var(--acc)}

/* Autocomplete */
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:var(--s1);border:1px solid var(--bd);
  border-radius:0 0 var(--r) var(--r);z-index:500;max-height:180px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.ac-item{padding:9px 12px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--bd);line-height:1.4}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item:active{background:var(--s2)}
.ac-name{color:var(--txt)}
.ac-sub{color:var(--mut);font-size:11px}

/* Vehicle profile */
.veh-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.veh-grid input{background:var(--bg);border:1.5px solid var(--bd);border-radius:6px;
  color:var(--txt);font:12px var(--ff);padding:6px 8px;width:100%;text-align:center}
.veh-lbl{font:700 9px var(--ff);color:var(--mut);text-transform:uppercase;display:block;margin-bottom:3px;text-align:center}
.section-title{font:700 10px var(--ff);letter-spacing:.6px;text-transform:uppercase;color:var(--mut);
  margin:10px 0 6px;display:flex;align-items:center;gap:6px}
.section-title::after{content:'';flex:1;height:1px;background:var(--bd)}

/* Route result card */
.route-card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-top:10px}
.route-fromto{padding:10px 12px;border-bottom:1px solid var(--bd);font-size:12.5px;color:var(--mut);word-break:break-word}
.route-fromto strong{color:var(--txt)}
.route-stats{display:flex;flex-wrap:wrap}
.route-stat{flex:1 1 80px;padding:10px 12px;text-align:center;border-right:1px solid var(--bd)}
.route-stat:last-child{border-right:none}
.route-stat-val{font:700 18px var(--fd);color:var(--txt)}
.route-stat-lbl{font-size:10px;color:var(--mut);text-transform:uppercase;margin-top:2px}
.route-actions{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd);flex-wrap:wrap}
.route-actions .btn{flex:1;justify-content:center;min-width:120px}
.route-note{padding:7px 12px;font-size:11px;color:var(--mut);border-top:1px solid var(--bd);font-style:italic}
.route-loading{color:var(--mut);font-size:13px;padding:12px 0;text-align:center}
.route-error{color:#f87171;font-size:13px;padding:10px 0;text-align:center}

/* Map tap popup */
.tap-popup{position:fixed;z-index:1000;background:var(--s1);border:1px solid var(--bd);
  border-radius:12px;padding:14px;box-shadow:0 8px 32px rgba(0,0,0,.6);min-width:200px}
.tap-popup-title{font-size:12px;color:var(--mut);margin-bottom:10px;text-align:center}
.tap-popup-btns{display:flex;flex-direction:column;gap:6px}

/* Leaflet overrides */
.leaflet-container{font-family:var(--ff)}
.leaflet-popup-content-wrapper{background:var(--s1);color:var(--txt);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.6)}
.leaflet-popup-tip{background:var(--s1)}
.leaflet-popup-content{font-size:12.5px;line-height:1.5}
.leaflet-control-zoom a{background:var(--s2)!important;color:var(--txt)!important;border-color:var(--bd)!important}
.leaflet-bar{border:1px solid var(--bd)!important;box-shadow:none!important}
.leaflet-control-layers{background:var(--s1)!important;border:1px solid var(--bd)!important;border-radius:var(--r)!important}
.leaflet-control-layers-expanded{padding:6px 10px!important;font:12px var(--ff)!important;color:var(--txt)!important}
.leaflet-control-layers label{color:var(--txt)!important;font-size:12px!important;margin:2px 0!important;display:flex!important;align-items:center!important;gap:5px!important}

/* Toast */
.toast{position:fixed;bottom:24px;right:14px;left:14px;background:var(--s1);border:1px solid var(--bd);
  border-left:3px solid var(--acc);border-radius:var(--r);padding:10px 14px;font-size:13px;
  color:var(--txt);box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:2000;animation:tin .2s ease;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.signature{position:fixed;bottom:6px;right:10px;font:italic 500 11px var(--ff);color:var(--mut);opacity:.4;pointer-events:none;z-index:10}

::-webkit-scrollbar{width:4px}.:-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
</style>

/* ── Icons ───────────────────────────────────────────────────────────── */
function makeIcon(color) {
  return L.divIcon({
    className: '',
    html: '<div style="width:28px;height:28px;background:'+color+';border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 3px '+color+'55,0 2px 8px rgba(0,0,0,.5)"></div>',
    iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-16]
  });
}
var iconFrom  = makeIcon('#22c55e');
var iconTo    = makeIcon('#E84042');
var iconUser  = makeIcon('#4F9EF8');

/* ── Map init ────────────────────────────────────────────────────────── */
function initMap() {
  MAP = L.map('map', {zoomControl:true, attributionControl:true, center:[45.5,10.5], zoom:6});
  var gmRoad   = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{maxZoom:20,subdomains:'0123',attribution:'&copy; Google Maps'});
  var gmSat    = L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{maxZoom:20,subdomains:'0123',attribution:'&copy; Google Maps'});
  var gmHybrid = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:20,subdomains:'0123',attribution:'&copy; Google Maps'});
  gmRoad.addTo(MAP);
  L.control.layers({'Stradale':gmRoad,'Satellite':gmSat,'Ibrida':gmHybrid},{},{position:'topright',collapsed:false}).addTo(MAP);
  MAP.on('click', onMapClick);
}

/* ── Map tap → ask from/to/nothing ──────────────────────────────────── */
function onMapClick(e) {
  if (tapPopupEl) { tapPopupEl.remove(); tapPopupEl = null; }
  var lat = e.latlng.lat, lng = e.latlng.lng;
  window._tapLat = lat; window._tapLng = lng;
  var pt = MAP.latLngToContainerPoint(e.latlng);
  tapPopupEl = document.createElement('div');
  tapPopupEl.className = 'tap-popup';
  tapPopupEl.style.left = Math.min(pt.x + 10, window.innerWidth - 220) + 'px';
  tapPopupEl.style.top  = Math.max(pt.y - 80, 60) + 'px';
  tapPopupEl.innerHTML =
    '<div class="tap-popup-title">Imposta punto come:</div>'
    +'<div class="tap-popup-btns">'
    +'<button type="button" class="btn btn-ghost btn-sm" onclick="setPointFromMap(window._tapLat,window._tapLng,&quot;from&quot;)">&#128681; Partenza</button>'
    +'<button type="button" class="btn btn-ghost btn-sm" onclick="setPointFromMap(window._tapLat,window._tapLng,&quot;to&quot;)">&#127937; Arrivo</button>'
    +'<button type="button" class="btn btn-ghost btn-sm" onclick="closeTapPopup()">&#10005; Nulla</button>'
    +'</div>';
  document.body.appendChild(tapPopupEl);
}

function closeTapPopup() {
  if (tapPopupEl) { tapPopupEl.remove(); tapPopupEl = null; }
}

function setPointFromMap(lat, lng, which) {
  closeTapPopup();
  setCoords(which, lat, lng);
  toast('Ricerca indirizzo...');
  fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lng+'&format=json&accept-language=it')
    .then(function(r){return r.json();})
    .then(function(d){
      var addr = d.display_name || (lat.toFixed(5)+', '+lng.toFixed(5));
      document.getElementById(which==='from'?'fromInput':'toInput').value = addr;
    })
    .catch(function(){
      document.getElementById(which==='from'?'fromInput':'toInput').value = lat.toFixed(5)+', '+lng.toFixed(5);
    });
}

function setCoords(which, lat, lng) {
  if (which === 'from') {
    fromCoords = {lat:lat, lng:lng};
    if (fromMarker) MAP.removeLayer(fromMarker);
    fromMarker = L.marker([lat,lng],{icon:iconFrom}).addTo(MAP).bindPopup('<b>Partenza</b>');
  } else {
    toCoords = {lat:lat, lng:lng};
    if (toMarker) MAP.removeLayer(toMarker);
    toMarker = L.marker([lat,lng],{icon:iconTo}).addTo(MAP).bindPopup('<b>Arrivo</b>');
  }
}

/* ── Autocomplete address search ─────────────────────────────────────── */
function onAddrInput(which) {
  var val = document.getElementById(which==='from'?'fromInput':'toInput').value.trim();
  var acEl = document.getElementById(which==='from'?'fromAC':'toAC');
  if (acTimers[which]) clearTimeout(acTimers[which]);
  if (val.length < 3) { acEl.style.display='none'; return; }
  acTimers[which] = setTimeout(function() {
    fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(val)+'&format=json&limit=5&accept-language=it')
      .then(function(r){return r.json();})
      .then(function(results){
        if (!results.length) { acEl.style.display='none'; return; }
        acEl.innerHTML = results.map(function(r){
          var parts = r.display_name.split(',');
          var name  = parts[0].trim();
          var sub   = parts.slice(1,3).join(',').trim();
          window['_ac_'+which+'_'+i] = {lat:r.lat,lon:r.lon,name:r.display_name};
          return '<div class="ac-item" data-which="'+which+'" data-idx="'+i+'"><div class="ac-name">'+name+'</div><div class="ac-sub">'+sub+'</div></div>';
        }).join('');
        acEl.style.display = 'block';
        acEl.onclick = function(e){
          var item=e.target.closest('[data-which]');if(!item)return;
          var w=item.dataset.which,idx=item.dataset.idx,d=window['_ac_'+w+'_'+idx];
          if(d)selectAC(w,parseFloat(d.lat),parseFloat(d.lon),d.name);
        };
      })
      .catch(function(){ acEl.style.display='none'; });
  }, 400);
}

function selectAC(which, lat, lng, display) {
  document.getElementById(which==='from'?'fromInput':'toInput').value = display;
  document.getElementById(which==='from'?'fromAC':'toAC').style.display = 'none';
  setCoords(which, parseFloat(lat), parseFloat(lng));
  MAP.setView([parseFloat(lat),parseFloat(lng)], 13);
}

/* ── GPS position ────────────────────────────────────────────────────── */
function locateMe() {
  if (!navigator.geolocation) { toast('Geolocalizzazione non supportata.'); return; }
  toast('Ricerca GPS...');
  var watchId = null, bestAcc = Infinity, timer = null;
  function stop() { if (watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;} if(timer){clearTimeout(timer);timer=null;} }
  watchId = navigator.geolocation.watchPosition(
    function(pos) {
      var acc = pos.coords.accuracy;
      if (acc < bestAcc) {
        bestAcc = acc;
        userCoords = {lat:pos.coords.latitude, lng:pos.coords.longitude};
        if (userMarker)    { MAP.removeLayer(userMarker);    userMarker=null; }
        if (accuracyCircle){ MAP.removeLayer(accuracyCircle);accuracyCircle=null; }
        accuracyCircle = L.circle([userCoords.lat,userCoords.lng],{radius:acc,color:'#4F9EF8',fillColor:'#4F9EF8',fillOpacity:.1,weight:1.5}).addTo(MAP);
        userMarker = L.marker([userCoords.lat,userCoords.lng],{icon:iconUser,zIndexOffset:1000}).addTo(MAP).bindPopup('La mia posizione');
        MAP.setView([userCoords.lat,userCoords.lng], 14);
        if (acc <= 20) { stop(); toast('GPS: +/- '+Math.round(acc)+' m'); }
        else toast('GPS: +/- '+Math.round(acc)+' m...');
      }
    },
    function(err) {
      stop();
      if (err.code===1) toast('Posizione negata. Vai nelle impostazioni del browser.');
      else toast('GPS non disponibile.');
    },
    {enableHighAccuracy:true, timeout:30000, maximumAge:0}
  );
  timer = setTimeout(function(){stop();if(userCoords)toast('Posizione finale: +/- '+Math.round(bestAcc)+' m');else toast('Nessun segnale GPS.');

}, 30000);
}

function useGPS(which) {
  if (!userCoords) {
    toast('Prima premi il tasto posizione (&#128205;) per trovare la tua posizione.');
    locateMe();
    return;
  }
  document.getElementById(which==='from'?'fromInput':'toInput').value = 'La mia posizione ('+userCoords.lat.toFixed(5)+', '+userCoords.lng.toFixed(5)+')';
  setCoords(which, userCoords.lat, userCoords.lng);
}

/* ── Parse input (address or coords) ────────────────────────────────── */
function resolveInput(which, callback) {
  var val = document.getElementById(which==='from'?'fromInput':'toInput').value.trim();
  var stored = which==='from' ? fromCoords : toCoords;
  if (stored) { callback(null, stored); return; }
  if (!val) { callback('Campo '+(which==='from'?'partenza':'arrivo')+' vuoto.'); return; }
  // Try parse as lat,lng
  var m = val.match(/^(-?\d+\.?\d*)[,\s]+(-?\d+\.?\d*)$/);
  if (m) { setCoords(which, parseFloat(m[1]), parseFloat(m[2])); callback(null, {lat:parseFloat(m[1]),lng:parseFloat(m[2])}); return; }
  // Geocode
  toast('Ricerca indirizzo...');
  fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(val)+'&format=json&limit=1')
    .then(function(r){return r.json();})
    .then(function(results){
      if (!results.length) { callback('Indirizzo non trovato: '+val); return; }
      var c = {lat:parseFloat(results[0].lat), lng:parseFloat(results[0].lon)};
      setCoords(which, c.lat, c.lng);
      callback(null, c);
    })
    .catch(function(){ callback('Errore di rete nella ricerca indirizzo.'); });
}

/* ── Calc route ──────────────────────────────────────────────────────── */
function calcRoute() {
  closeTapPopup();
  resolveInput('from', function(errF, cFrom) {
    if (errF) { toast(errF); return; }
    resolveInput('to', function(errT, cTo) {
      if (errT) { toast(errT); return; }
      document.getElementById('routeResult').innerHTML = '<div class="route-loading">&#128506; Calcolo percorso HGV con restrizioni reali...</div>';
      var alt=parseFloat(document.getElementById('vAlt').value)||4.0;
      var lar=parseFloat(document.getElementById('vLar').value)||2.55;
      var lun=parseFloat(document.getElementById('vLun').value)||18.75;
      var pes=parseFloat(document.getElementById('vPes').value)||40;
      var ass=parseFloat(document.getElementById('vAss').value)||11.5;
      fetch('https://api.openrouteservice.org/v2/directions/driving-hgv/geojson',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':ORS_KEY},
        body:JSON.stringify({
          coordinates:[[cFrom.lng,cFrom.lat],[cTo.lng,cTo.lat]],
          instructions:false, elevation:false,
          options:{profile_params:{restrictions:{height:alt,width:lar,length:lun,weight:pes,axleload:ass}}}
        })
      })
      .then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error(e.error&&e.error.message?e.error.message:'Errore API ('+r.status+')');}); return r.json();})
      .then(function(data){
        if(!data.features||!data.features.length)throw new Error('Nessun percorso trovato.');
        var feat=data.features[0], sum=feat.properties.summary;
        var coords=feat.geometry.coordinates;
        var distKm=(sum.distance/1000).toFixed(1);
        var HGV_F={IT:1.56,FR:1.40,DE:1.50,CH:1.56,AT:1.56,ES:1.42,BE:1.40,NL:1.38,PL:1.50,CZ:1.45};
        var factor=1.47;
        var hgvSec=Math.round(sum.duration*factor);
        var h=Math.floor(hgvSec/3600), m=Math.floor((hgvSec%3600)/60);
        var hgvTime=(h>0?h+'h ':'')+m+'min';
        var arr=new Date(); arr.setSeconds(arr.getSeconds()+hgvSec);
        var arrival=arr.getHours().toString().padStart(2,'0')+':'+arr.getMinutes().toString().padStart(2,'0');
        if(routeLayer){MAP.removeLayer(routeLayer);routeLayer=null;}
        routeLayer=L.geoJSON(feat.geometry,{style:{color:'#E84042',weight:5,opacity:.85,lineCap:'round',lineJoin:'round'}}).addTo(MAP);
        MAP.fitBounds(routeLayer.getBounds().pad(0.08));
        window.orsCoords=coords; window.orsFromLat=cFrom.lat; window.orsFromLng=cFrom.lng; window.orsToLat=cTo.lat; window.orsToLng=cTo.lng;
        var fromLabel=document.getElementById('fromInput').value.split(',')[0].slice(0,30);
        var toLabel=document.getElementById('toInput').value.split(',')[0].slice(0,30);
        document.getElementById('routeResult').innerHTML=
          '<div class="route-card">'
          +'<div class="route-fromto"><strong>'+fromLabel+'</strong> &rarr; <strong>'+toLabel+'</strong></div>'
          +'<div class="route-stats">'
          +'<div class="route-stat"><div class="route-stat-val">'+distKm+' km</div><div class="route-stat-lbl">Distanza</div></div>'
          +'<div class="route-stat"><div class="route-stat-val">'+hgvTime+'</div><div class="route-stat-lbl">Tempo HGV</div></div>'
          +'<div class="route-stat"><div class="route-stat-val">'+arrival+'</div><div class="route-stat-lbl">Arrivo stimato</div></div>'
          +'</div>'
          +'<div class="route-actions">'
          +'<button type="button" class="btn btn-primary btn-sm" onclick="startNavigation()">&#9654; NAVIGA</button>'
          +'<button type="button" class="btn btn-ghost btn-sm" onclick="openGoogleMaps()">&#128506; Google Maps</button>'
          +'<button type="button" class="btn btn-ghost btn-sm" onclick="exportGPX()">&#128229; GPX</button>'
          +'</div>'
          +'<div class="route-note">Percorso HGV &gt;3.5t &bull; Alt.'+alt+'m &bull; Peso '+pes+'t &bull; Asse '+ass+'t</div>'
          +'</div>';
      })
      .catch(function(err){document.getElementById('routeResult').innerHTML='<div class="route-error">&#9888; '+err.message+'</div>';});
    });
  });
}

function openGoogleMaps(){
  if(!window.orsCoords)return;
  var N=Math.max(1,Math.floor(window.orsCoords.length/8));var wp=[];
  for(var i=N;i<window.orsCoords.length-N;i+=N)wp.push(window.orsCoords[i][1]+','+window.orsCoords[i][0]);
  window.open('https://www.google.com/maps/dir/'+window.orsFromLat+','+window.orsFromLng+'/'+wp.join('/')+'/'+window.orsToLat+','+window.orsToLng,'_blank');
}

function exportGPX(){
  if(!window.orsCoords)return;
  var pts=window.orsCoords.map(function(c){return '    <trkpt lat="'+c[1]+'" lon="'+c[0]+'"></trkpt>';}).join('\n');
  var gpx='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Navigator NTSE">\n  <trk><name>Percorso</name><trkseg>\n'+pts+'\n  </trkseg></trk>\n</gpx>';
  var blob=new Blob([gpx],{type:'application/gpx+xml'});
  var a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'percorso.gpx'});
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
  toast('GPX esportato.');
}

/* ── Toast ───────────────────────────────────────────────────────────── */
var _tt;
function toast(msg){
  var old=document.getElementById('_toast');if(old)old.remove();clearTimeout(_tt);
  var el=Object.assign(document.createElement('div'),{id:'_toast',className:'toast',textContent:msg});
  document.body.appendChild(el);_tt=setTimeout(function(){el.remove();},3500);
}

/* Close tap popup on panel scroll or outside click */
document.addEventListener('click', function(e){
  if(tapPopupEl && !tapPopupEl.contains(e.target)){ closeTapPopup(); }
}, true);
document.addEventListener('keydown', function(e){if(e.key==='Escape')closeTapPopup();});

/* Close autocomplete on outside click */
document.addEventListener('click', function(e){
  ['fromAC','toAC'].forEach(function(id){
    var el=document.getElementById(id);
    if(el&&!el.contains(e.target)&&e.target.id!=='fromInput'&&e.target.id!=='toInput')
      el.style.display='none';
  });
});

loadVehicle();
