name: Keep scheduled workflows alive
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"
permissions:
  contents: write
concurrency:
  group: keep-scheduled-workflows-alive
  cancel-in-progress: false
jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Commit monthly heartbeat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat/last-run.txt
          git diff --cached --quiet && exit 0
          git commit -m "Monthly workflow heartbeat"
          for A in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; sleep 5; done
          exit 1
