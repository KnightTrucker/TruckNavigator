name: Build Road Safety PBF v10
on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 5"
permissions:
  contents: write
concurrency:
  group: road-safety-pbf-v10
  cancel-in-progress: false

jobs:
  country:
    name: Build ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {cc: IT, slug: italy}
          - {cc: FR, slug: france}
          - {cc: DE, slug: germany}
          - {cc: CH, slug: switzerland}
          - {cc: AT, slug: austria}
          - {cc: BE, slug: belgium}
          - {cc: LU, slug: luxembourg}
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip osmium
      - name: Build country
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 \
            -o country.osm.pbf "https://download.geofabrik.de/europe/${{ matrix.slug }}-latest.osm.pbf"
          cat > build.py <<'PY'
          import json,math,sys,hashlib
          from pathlib import Path
          from collections import defaultdict
          from datetime import datetime,timezone
          import osmium
          cc,pbf,out=sys.argv[1:]; out=Path(out)/cc; out.mkdir(parents=True,exist_ok=True)
          keep=('highway','enforcement','maxspeed','maxspeed:hgv','direction','ref','name','hgv','hgv:conditional','access','access:conditional','maxheight','maxheight:conditional','maxweight','maxweight:conditional','maxwidth','maxwidth:conditional','maxlength','maxlength:conditional','maxaxleload','maxaxleload:conditional','overtaking:hgv','overtaking:hgv:forward','overtaking:hgv:backward','overtaking:hgv:conditional','hgv:overtaking','hgv:overtaking:conditional','traffic_sign','barrier','toll','toll:hgv','tunnel','hazmat','hazmat:conditional','hazmat:water','hazmat:tunnel','adr','oneway')
          def fs(t):
            s=[]; ts=str(t.get('traffic_sign') or '').lower()
            if t.get('highway')=='speed_camera' or t.get('enforcement')=='maxspeed':s+=['cameras']
            if any(t.get(k) for k in ('overtaking:hgv','overtaking:hgv:forward','overtaking:hgv:backward','overtaking:hgv:conditional','hgv:overtaking','hgv:overtaking:conditional')) or any(x in ts for x in ('277','b3a','overtak')):s+=['overtaking']
            if any(t.get(k) for k in ('hgv','hgv:conditional','maxheight','maxheight:conditional','maxweight','maxweight:conditional','maxwidth','maxwidth:conditional','maxlength','maxlength:conditional','maxaxleload','maxaxleload:conditional')):s+=['restrictions']
            if t.get('barrier')=='toll_booth' or t.get('highway')=='toll_gantry' or t.get('toll') not in (None,'','no') or t.get('toll:hgv') not in (None,'','no'):s+=['tolls']
            if t.get('tunnel') not in (None,'','no'):s+=['tunnels']
            if any(t.get(k) for k in ('hazmat','hazmat:conditional','hazmat:water','hazmat:tunnel','adr')):s+=['hazmat']
            if t.get('maxspeed') or t.get('maxspeed:hgv'):s+=['speedlimits']
            return s
          tiles=defaultdict(list); counts=defaultdict(int)
          def add(typ,oid,t,g,lat,lon):
            f=fs(t)
            if not f:return
            for x in f:counts[x]+=1
            r={'id':f'{typ}/{oid}','lat':round(lat,7),'lon':round(lon,7),'families':f,'tags':{k:str(t.get(k)) for k in keep if t.get(k) not in (None,'')}}
            if g:r['geometry']=g
            tiles[f'{math.floor(lat*2)}_{math.floor(lon*2)}'].append(r)
          class H(osmium.SimpleHandler):
            def node(self,n):
              if n.location.valid():add('node',n.id,n.tags,None,float(n.location.lat),float(n.location.lon))
            def way(self,w):
              if not fs(w.tags):return
              try:g=[[round(float(n.lat),7),round(float(n.lon),7)] for n in w.nodes if n.location.valid()]
              except:return
              if g:
                m=g[len(g)//2];add('way',w.id,w.tags,g,m[0],m[1])
          H().apply_file(pbf,locations=True); mt={}; total=0
          for k,v in tiles.items():
            v=list({x['id']:x for x in v}.values());total+=len(v);raw=json.dumps({'schemaVersion':10,'country':cc,'tile':k,'count':len(v),'items':v},separators=(',',':')).encode();(out/f'{k}.json').write_bytes(raw);mt[k]={'file':f'{cc}/{k}.json','count':len(v),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'manifest.json').write_text(json.dumps({'schemaVersion':10,'country':cc,'generatedAt':datetime.now(timezone.utc).isoformat(),'records':total,'counts':dict(counts),'tiles':mt},indent=2))
          print(cc,total,dict(counts))
          if total<10:raise SystemExit('too few records')
          PY
          .venv/bin/python -m py_compile build.py
          mkdir -p out
          .venv/bin/python build.py "${{ matrix.cc }}" country.osm.pbf out
      - uses: actions/upload-artifact@v4
        with:
          name: rs10-${{ matrix.cc }}
          path: out/${{ matrix.cc }}
          retention-days: 1

  publish:
    needs: country
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: rs10-*
          path: dl
      - name: Assemble and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf offline/road_safety_v10.new
          mkdir -p offline/road_safety_v10.new
          for CC in IT FR DE CH AT BE LU; do
            M="$(find dl -path "*/${CC}/manifest.json" -print -quit)"; test -n "$M"
            cp -a "$(dirname "$M")" "offline/road_safety_v10.new/$CC"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          r=Path('offline/road_safety_v10.new');cs={};tot=0;c={}
          for cc in ('IT','FR','DE','CH','AT','BE','LU'):
            d=json.loads((r/cc/'manifest.json').read_text()); assert d['country']==cc and d['records']>=10 and d['tiles'];tot+=d['records']
            for k,v in d['counts'].items():c[k]=c.get(k,0)+v
            cs[cc]={'manifest':f'{cc}/manifest.json','records':d['records'],'counts':d['counts'],'tiles':len(d['tiles'])}
          (r/'manifest.json').write_text(json.dumps({'schemaVersion':10,'generatedAt':datetime.now(timezone.utc).isoformat(),'countries':cs,'totalRecords':tot,'counts':c,'tileDegrees':0.5,'source':'Geofabrik OpenStreetMap PBF','scope':'IT,FR,DE,CH,AT,BE,LU'},indent=2))
          PY
          rm -rf offline/road_safety_v10
          mv offline/road_safety_v10.new offline/road_safety_v10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A offline/road_safety_v10
          git diff --cached --quiet && exit 0
          git commit -m "Update offline Road Safety v10 PBF"
          for A in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; sleep 10; done
          exit 1
