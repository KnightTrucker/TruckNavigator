name: Update European road safety database

on:
  workflow_dispatch:

  schedule:
    # Aggiornamento automatico ogni notte
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: update-europe-road-safety
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update European road safety database
        shell: bash
        run: |
          python - <<'PY'

          import json
          import time
          import urllib.parse
          import urllib.request

          from datetime import datetime, timezone
          from pathlib import Path


          OUT = Path("road_safety.json")


          # ============================================================
          # PAESI EUROPEI
          # ============================================================

          COUNTRIES = {

              "AL": "Albania",
              "AD": "Andorra",
              "AT": "Austria",
              "BE": "Belgium",
              "BA": "Bosnia and Herzegovina",
              "BG": "Bulgaria",
              "HR": "Croatia",
              "CY": "Cyprus",
              "CZ": "Czechia",
              "DK": "Denmark",
              "EE": "Estonia",
              "FI": "Finland",
              "FR": "France",
              "DE": "Germany",
              "GR": "Greece",
              "HU": "Hungary",
              "IS": "Iceland",
              "IE": "Ireland",
              "IT": "Italy",
              "LV": "Latvia",
              "LI": "Liechtenstein",
              "LT": "Lithuania",
              "LU": "Luxembourg",
              "MT": "Malta",
              "MD": "Moldova",
              "MC": "Monaco",
              "ME": "Montenegro",
              "NL": "Netherlands",
              "MK": "North Macedonia",
              "NO": "Norway",
              "PL": "Poland",
              "PT": "Portugal",
              "RO": "Romania",
              "SM": "San Marino",
              "RS": "Serbia",
              "SK": "Slovakia",
              "SI": "Slovenia",
              "ES": "Spain",
              "SE": "Sweden",
              "CH": "Switzerland",
              "TR": "Turkey",
              "UA": "Ukraine",
              "GB": "United Kingdom",
              "VA": "Vatican City"
          }


          ENDPOINTS = [

              "https://overpass-api.de/api/interpreter",

              "https://overpass.kumi.systems/api/interpreter",

              "https://overpass.nchc.org.tw/api/interpreter"
          ]


          # ============================================================
          # CONVERSIONE NUMERI OSM
          # ============================================================

          def number(value):

              if value is None:
                  return None

              s = str(value).strip().lower()

              replacements = [

                  "tonnes",
                  "tonne",
                  "tons",
                  "ton",

                  "meters",
                  "meter",
                  "metres",
                  "metre"
              ]

              for x in replacements:
                  s = s.replace(x, "")

              s = s.replace(",", ".").strip()

              try:
                  return float(s)

              except:
                  return None


          # ============================================================
          # OVERPASS
          # ============================================================

          def download_country(code):

              query = f'''
              [out:json][timeout:180];

              area["ISO3166-1"="{code}"][admin_level=2]->.country;

              (

                nwr(area.country)["hgv"];

                nwr(area.country)["hgv:conditional"];

                nwr(area.country)["maxheight"];

                nwr(area.country)["maxheight:conditional"];

                nwr(area.country)["maxweight"];

                nwr(area.country)["maxweight:conditional"];

                nwr(area.country)["maxwidth"];

                nwr(area.country)["maxwidth:conditional"];

                nwr(area.country)["maxlength"];

                nwr(area.country)["maxlength:conditional"];

                nwr(area.country)["maxaxleload"];

                nwr(area.country)["maxaxleload:conditional"];

                node(area.country)["highway"="speed_camera"];

              );

              out center tags;
              '''


              payload = urllib.parse.urlencode(
                  {"data": query}
              ).encode()


              last_error = None


              for endpoint in ENDPOINTS:

                  for attempt in range(3):

                      try:

                          print(
                              f"Download {code} "
                              f"da {endpoint} "
                              f"tentativo {attempt+1}"
                          )


                          request = urllib.request.Request(

                              endpoint,

                              data=payload,

                              headers={

                                  "User-Agent":
                                  "KnightTruckerNavy-European-Updater/2.0",

                                  "Content-Type":
                                  "application/x-www-form-urlencoded"
                              },

                              method="POST"
                          )


                          with urllib.request.urlopen(
                              request,
                              timeout=210
                          ) as response:

                              return json.loads(
                                  response.read().decode("utf-8")
                              )


                      except Exception as error:

                          last_error = error

                          print(
                              "Errore:",
                              error
                          )

                          time.sleep(
                              5 + attempt * 5
                          )


              raise RuntimeError(
                  str(last_error)
              )


          # ============================================================
          # CONVERSIONE RECORD
          # ============================================================

          def convert_element(
              element,
              country_code,
              country_name
          ):

              tags = element.get("tags") or {}


              osm_type = element.get("type")

              osm_id = element.get("id")


              if not osm_type or osm_id is None:
                  return None


              lat = element.get("lat")

              lon = element.get("lon")


              center = element.get("center") or {}


              if lat is None:
                  lat = center.get("lat")


              if lon is None:
                  lon = center.get("lon")


              is_camera = (
                  tags.get("highway")
                  == "speed_camera"
              )


              restriction = any(

                  key in tags

                  for key in (

                      "hgv",
                      "hgv:conditional",

                      "maxheight",
                      "maxheight:conditional",

                      "maxweight",
                      "maxweight:conditional",

                      "maxwidth",
                      "maxwidth:conditional",

                      "maxlength",
                      "maxlength:conditional",

                      "maxaxleload",
                      "maxaxleload:conditional"
                  )
              )


              if not is_camera and not restriction:
                  return None


              item = {

                  "id":
                      f"{osm_type}/{osm_id}",

                  "country":
                      country_code,

                  "countryName":
                      country_name,

                  "osmType":
                      osm_type,

                  "osmId":
                      osm_id,

                  "lat":
                      lat,

                  "lon":
                      lon,

                  "name":
                      tags.get("name")
                      or tags.get("ref")
                      or "",

                  "road":
                      tags.get("name")
                      or "",

                  "source":
                      "OpenStreetMap",

                  "type":
                      "speed_camera"
                      if is_camera
                      else "hgv_restriction",

                  "tags": {}
              }


              useful_tags = (

                  "hgv",
                  "hgv:conditional",

                  "access",
                  "access:conditional",

                  "maxheight",
                  "maxheight:conditional",

                  "maxweight",
                  "maxweight:conditional",

                  "maxwidth",
                  "maxwidth:conditional",

                  "maxlength",
                  "maxlength:conditional",

                  "maxaxleload",
                  "maxaxleload:conditional",

                  "traffic_sign",

                  "highway",

                  "ref",

                  "name"
              )


              for tag in useful_tags:

                  if tag in tags:

                      item["tags"][tag] = tags[tag]


              # ========================================================
              # DIVIETO HGV
              # ========================================================

              if "hgv" in tags:

                  hgv = str(
                      tags["hgv"]
                  ).lower()


                  item["hgvRaw"] = tags["hgv"]


                  if hgv in (
                      "no",
                      "private"
                  ):

                      item["hgv"] = False

                  else:

                      item["hgv"] = True


              # ========================================================
              # LIMITI NUMERICI
              # ========================================================

              fields = (

                  "maxheight",

                  "maxweight",

                  "maxwidth",

                  "maxlength",

                  "maxaxleload"
              )


              for field in fields:

                  value = number(
                      tags.get(field)
                  )

                  if value is not None:

                      item[field] = value


              # ========================================================
              # RESTRIZIONI CONDIZIONALI
              # ========================================================

              conditional = {}


              for field in (

                  "hgv:conditional",

                  "access:conditional",

                  "maxheight:conditional",

                  "maxweight:conditional",

                  "maxwidth:conditional",

                  "maxlength:conditional",

                  "maxaxleload:conditional"
              ):

                  if field in tags:

                      conditional[field] = tags[field]


              if conditional:

                  item["conditional"] = conditional


              return item


          # ============================================================
          # DATABASE
          # ============================================================

          all_items = []

          countries_ok = []

          countries_failed = []


          for code, name in COUNTRIES.items():

              print()
              print("=" * 60)
              print(
                  "PAESE:",
                  name,
                  "(" + code + ")"
              )
              print("=" * 60)


              try:

                  data = download_country(code)


                  count = 0


                  for element in data.get(
                      "elements",
                      []
                  ):

                      item = convert_element(
                          element,
                          code,
                          name
                      )


                      if item:

                          all_items.append(
                              item
                          )

                          count += 1


                  countries_ok.append({

                      "code": code,

                      "name": name,

                      "records": count
                  })


                  print(
                      f"{name}: {count} record"
                  )


              except Exception as error:

                  print(
                      f"ERRORE {name}:",
                      error
                  )


                  countries_failed.append({

                      "code": code,

                      "name": name,

                      "error": str(error)
                  })


              # Non martelliamo Overpass

              time.sleep(3)


          # ============================================================
          # ELIMINA DUPLICATI
          # ============================================================

          unique = {}


          for item in all_items:

              unique[item["id"]] = item


          items = list(
              unique.values()
          )


          items.sort(

              key=lambda x: (

                  x.get(
                      "country",
                      ""
                  ),

                  x.get(
                      "type",
                      ""
                  ),

                  x.get(
                      "id",
                      ""
                  )
              )
          )


          now = datetime.now(
              timezone.utc
          )


          hgv_count = sum(

              1 for item in items

              if item.get("type")
              == "hgv_restriction"
          )


          camera_count = sum(

              1 for item in items

              if item.get("type")
              == "speed_camera"
          )


          result = {

              "version": 3,

              "updatedAt":
                  int(
                      now.timestamp()
                      * 1000
                  ),

              "updatedAtIso":
                  now.isoformat().replace(
                      "+00:00",
                      "Z"
                  ),

              "source":
                  "OpenStreetMap / Overpass API",

              "scope":
                  "Europe",

              "description":
                  "KnightTruckerNavy European HGV road safety database",

              "counts": {

                  "total":
                      len(items),

                  "hgvRestrictions":
                      hgv_count,

                  "speedCameras":
                      camera_count,

                  "countries":
                      len(countries_ok),

                  "failedCountries":
                      len(countries_failed)
              },

              "countries":
                  countries_ok,

              "failedCountries":
                  countries_failed,

              "items":
                  items
          }


          OUT.write_text(

              json.dumps(
                  result,
                  ensure_ascii=False,
                  separators=(",", ":")
              ),

              encoding="utf-8"
          )


          print()
          print("=" * 60)

          print(
              "DATABASE COMPLETATO"
          )

          print(
              "Record totali:",
              len(items)
          )

          print(
              "Restrizioni HGV:",
              hgv_count
          )

          print(
              "Autovelox:",
              camera_count
          )

          print(
              "Paesi completati:",
              len(countries_ok)
          )

          print(
              "Paesi falliti:",
              len(countries_failed)
          )

          print("=" * 60)

          PY


      - name: Commit database

        shell: bash

        run: |

          if git diff --quiet -- road_safety.json; then

            echo "Nessuna modifica al database."

            exit 0

          fi


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add road_safety.json


          git commit \
            -m "Aggiornamento database sicurezza stradale Europa"


          git push
