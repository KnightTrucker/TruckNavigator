name: Build offline Europe service areas

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: write

concurrency:
  group: offline-europe-service-areas
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  extract:
    name: extract (${{ matrix.cc }}, ${{ matrix.slug }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {cc: IT, slug: italy}
          - {cc: FR, slug: france}
          - {cc: DE, slug: germany}
          - {cc: CH, slug: switzerland}
          - {cc: AT, slug: austria}
          - {cc: BE, slug: belgium}
          - {cc: LU, slug: luxembourg}
          - {cc: NL, slug: netherlands}
          - {cc: ES, slug: spain}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium

      - name: Prepare folders
        run: |
          mkdir -p .osm
          mkdir -p offline/service_areas

      - name: Download ${{ matrix.cc }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://download.geofabrik.de/europe/${{ matrix.slug }}-latest.osm.pbf"
          OUT=".osm/${{ matrix.cc }}.osm.pbf"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 30 "$URL" --output "$OUT"
          test -s "$OUT"
          ls -lh "$OUT"

      - name: Extract strict service areas
        shell: bash
        run: |
          set -euo pipefail
          python tools/offline_services/build_service_areas_europe.py             "${{ matrix.cc }}"             "offline/service_areas/${{ matrix.cc }}.json"             ".osm/${{ matrix.cc }}.osm.pbf"
          test -s "offline/service_areas/${{ matrix.cc }}.json"

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          python - "offline/service_areas/${{ matrix.cc }}.json" "${{ matrix.cc }}" <<'PY'
          import json, sys
          path, cc = sys.argv[1], sys.argv[2]
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          if data.get("country") != cc:
              raise SystemExit(f"country non valido: {data.get('country')} != {cc}")
          areas = data.get("areas")
          if not isinstance(areas, list) or not areas:
              raise SystemExit("areas mancante o vuoto")
          if data.get("count") != len(areas):
              raise SystemExit("count non coerente")
          print("VALID:", path, "count =", len(areas))
          PY

      - name: Save country database
        uses: actions/upload-artifact@v4
        with:
          name: service-areas-${{ matrix.cc }}
          path: offline/service_areas/${{ matrix.cc }}.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  publish:
    name: publish databases
    needs: extract
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout current databases
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download completed country databases
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: service-areas-*
          merge-multiple: true
          path: offline/service_areas

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Europe manifest
        run: python tools/offline_services/build_europe_manifest.py

      - name: Validate Europe manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {"IT","FR","DE","CH","AT","BE","LU","NL","ES"}
          p = Path("offline/service_areas/manifest_europe.json")
          if not p.exists():
              raise SystemExit("manifest_europe.json mancante")
          data = json.loads(p.read_text(encoding="utf-8"))
          found = set(data.get("countries", {}).keys())
          missing = sorted(expected - found)
          print("Paesi nel manifest:", ", ".join(sorted(found)))
          if missing:
              raise SystemExit("NON PUBBLICO: mancano database per: " + ", ".join(missing))
          for cc in sorted(expected):
              fp = Path("offline/service_areas") / f"{cc}.json"
              if not fp.exists() or fp.stat().st_size == 0:
                  raise SystemExit(f"Database mancante o vuoto: {fp}")
          print("Manifest completo: 9/9 paesi")
          PY

      - name: Commit databases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/service_areas/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git commit -m "Update Europe offline service areas"
          for ATTEMPT in 1 2 3; do
            if git push; then
              echo "Push completato."
              exit 0
            fi
            echo "Push fallito, tentativo $ATTEMPT/3. Riallineo main..."
            git pull --rebase origin main
            sleep 10
          done
          echo "Push fallito dopo 3 tentativi."
          exit 1
