name: Build Fuel Card Networks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 2'

permissions:
  contents: write

jobs:
  build-dkv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build DKV official network JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline/fuel_cards .tmp_dkv
          python - <<'PY'
          import io, json, os, re, urllib.request, zipfile
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          URL = 'https://my.dkv-mobility.com/apidnext/geo-static-content-service/v1/station-network,zip/dkv_standard_gpx.zip'
          req = urllib.request.Request(URL, headers={'User-Agent':'KnightTruckerNavy/0.0.60'})
          with urllib.request.urlopen(req, timeout=90) as r:
              payload = r.read()
          if len(payload) < 1000:
              raise RuntimeError('DKV download unexpectedly small')

          z = zipfile.ZipFile(io.BytesIO(payload))
          gpx_names = [n for n in z.namelist() if n.lower().endswith('.gpx')]
          if not gpx_names:
              raise RuntimeError('No GPX file in DKV ZIP')

          def local(tag):
              return tag.rsplit('}',1)[-1].lower()
          def text_of(el, name):
              for ch in list(el):
                  if local(ch.tag)==name and ch.text:
                      return ch.text.strip()
              return ''
          def all_text(el):
              vals=[]
              for ch in el.iter():
                  if ch.text and ch.text.strip(): vals.append(ch.text.strip())
              return ' | '.join(vals)
          def compact_ws(s):
              return re.sub(r'\s+',' ',s or '').strip()

          seen=set(); stations=[]
          for gn in gpx_names:
              root=ET.fromstring(z.read(gn))
              for w in root.iter():
                  if local(w.tag)!='wpt':
                      continue
                  try:
                      lat=float(w.attrib['lat']); lon=float(w.attrib['lon'])
                  except Exception:
                      continue
                  name=compact_ws(text_of(w,'name')) or 'DKV station'
                  desc=compact_ws(text_of(w,'desc'))
                  cmt=compact_ws(text_of(w,'cmt'))
                  full=compact_ws(' | '.join([name,desc,cmt,all_text(w)]))
                  key=(round(lat,6),round(lon,6),name.lower())
                  if key in seen: continue
                  seen.add(key)

                  # GPX exports differ slightly over time. Keep useful source text,
                  # but never invent acceptance: every point in this file is DKV network data.
                  address=''
                  m=re.search(r'(?:address|adresse|indirizzo)\s*[:=-]\s*([^|]+)', full, re.I)
                  if m: address=compact_ws(m.group(1))
                  brand=''
                  for b in ['TotalEnergies','Shell','Esso','BP','AS24','AVIA','Eni','Q8','Tamoil']:
                      if re.search(r'\b'+re.escape(b)+r'\b', full, re.I):
                          brand=b; break

                  stations.append({
                      'id': f'dkv-{len(stations)+1}',
                      'lat': lat,
                      'lng': lon,
                      'name': name,
                      'brand': brand,
                      'address': address or desc or cmt,
                      'cards': ['dkv'],
                      'source': 'DKV Mobility official POI',
                      'sourceText': full[:700]
                  })

          stations.sort(key=lambda x:(x['lat'],x['lng'],x['name']))
          if len(stations) < 1000:
              raise RuntimeError(f'Only {len(stations)} DKV points parsed; refusing to publish')

          out={
              'schemaVersion':1,
              'network':'DKV',
              'generatedAt':datetime.now(timezone.utc).isoformat(),
              'source':URL,
              'count':len(stations),
              'stations':stations
          }
          os.makedirs('offline/fuel_cards', exist_ok=True)
          with open('offline/fuel_cards/dkv.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          with open('offline/fuel_cards/manifest.json','w',encoding='utf-8') as f:
              json.dump({'schemaVersion':1,'generatedAt':out['generatedAt'],'networks':{'dkv':{'count':len(stations),'source':URL}}},f,ensure_ascii=False,indent=2)
          print('DKV stations:',len(stations))
          PY

      - name: Commit generated DKV data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/fuel_cards/dkv.json offline/fuel_cards/manifest.json
          if git diff --cached --quiet; then
            echo "No DKV changes"
            exit 0
          fi
          git commit -m "Update official DKV fuel-card network"
          git push

  build-as24:
    needs: build-dkv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install AS24 collector
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture official AS24 Station Finder data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp_as24 offline/fuel_cards
          cat > .tmp_as24/capture.py <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          URL="https://network.as24.com/stationfinder/en/stations"
          OUT=Path(".tmp_as24/responses")
          OUT.mkdir(parents=True, exist_ok=True)

          def looks_json(ct, txt):
              ct=(ct or "").lower()
              t=(txt or "").lstrip()
              return ("json" in ct) or t.startswith("{") or t.startswith("[")

          async def main():
              saved=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  page=await browser.new_page()

                  async def handle(resp):
                      try:
                          if resp.request.resource_type not in ("xhr","fetch","document"):
                              return
                          txt=await resp.text()
                          if len(txt)<100 or not looks_json(resp.headers.get("content-type",""), txt):
                              return
                          # Save every official JSON/XHR response. The parser below decides
                          # which payload actually contains the station collection.
                          fn=OUT/f"{len(saved):04d}.json"
                          fn.write_text(txt, encoding="utf-8")
                          saved.append((str(fn), resp.url, len(txt)))
                      except Exception:
                          pass

                  page.on("response", handle)
                  await page.goto(URL, wait_until="domcontentloaded", timeout=120000)

                  for label in ["Accept all","Accept","I agree","Allow all"]:
                      try:
                          b=page.get_by_role("button", name=label, exact=False)
                          if await b.count():
                              await b.first.click(timeout=2500)
                              break
                      except Exception:
                          pass

                  # Give the map/list time to load its backing dataset.
                  await page.wait_for_timeout(15000)

                  # Force a modest interaction so lazy-loaded station requests fire too.
                  try:
                      await page.mouse.wheel(0, 1800)
                      await page.wait_for_timeout(5000)
                  except Exception:
                      pass

                  # Save embedded state as a second official source when present.
                  try:
                      state=await page.evaluate("""() => {
                        const out={};
                        for (const k of ['__NEXT_DATA__','__NUXT__']) {
                          if (window[k]) out[k]=window[k];
                        }
                        return out;
                      }""")
                      if state:
                          (OUT/"embedded-state.json").write_text(
                              json.dumps(state, ensure_ascii=False), encoding="utf-8")
                  except Exception:
                      pass

                  print("Captured official AS24 responses:", len(saved))
                  for item in sorted(saved, key=lambda x:x[2], reverse=True)[:12]:
                      print(item[2], item[1])
                  await browser.close()

          asyncio.run(main())
          PY
          python .tmp_as24/capture.py

      - name: Build AS24 network JSON from captured official data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, re
          from pathlib import Path
          from datetime import datetime, timezone

          ROOT=Path(".tmp_as24/responses")
          files=list(ROOT.glob("*.json"))
          if not files:
              raise RuntimeError("AS24 Station Finder returned no JSON payloads")

          LAT_KEYS=("lat","latitude","y")
          LON_KEYS=("lng","lon","long","longitude","x")
          NAME_KEYS=("name","stationname","station_name","title","label","commercialname","commercial_name")
          ID_KEYS=("id","stationid","station_id","siteid","site_id","code","stationnumber","station_number")
          ADDRESS_KEYS=("address","adresse","street","streetaddress","street_address","formattedaddress","formatted_address")
          CITY_KEYS=("city","town","locality","ville")
          COUNTRY_KEYS=("country","countrycode","country_code","pays")

          def nk(s): return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def scalar(v):
              return isinstance(v,(str,int,float,bool)) or v is None
          def asnum(v):
              try:
                  if isinstance(v,str): v=v.strip().replace(",",".")
                  return float(v)
              except Exception:
                  return None
          def get_key(d, candidates):
              if not isinstance(d,dict): return None
              by={nk(k):k for k in d}
              for c in candidates:
                  nc=nk(c)
                  if nc in by: return d[by[nc]]
              return None
          def find_coords(d):
              lat=get_key(d,LAT_KEYS); lon=get_key(d,LON_KEYS)
              la,lo=asnum(lat),asnum(lon)
              if la is not None and lo is not None and -90<=la<=90 and -180<=lo<=180:
                  return la,lo
              # common GeoJSON form
              g=get_key(d,("geometry","location","position","coordinates"))
              if isinstance(g,dict):
                  c=get_key(g,("coordinates",))
                  if isinstance(c,list) and len(c)>=2:
                      lo,la=asnum(c[0]),asnum(c[1])
                      if la is not None and lo is not None and -90<=la<=90 and -180<=lo<=180:
                          return la,lo
                  la=get_key(g,LAT_KEYS); lo=get_key(g,LON_KEYS)
                  la,lo=asnum(la),asnum(lo)
                  if la is not None and lo is not None and -90<=la<=90 and -180<=lo<=180:
                      return la,lo
              if isinstance(g,list) and len(g)>=2:
                  lo,la=asnum(g[0]),asnum(g[1])
                  if la is not None and lo is not None and -90<=la<=90 and -180<=lo<=180:
                      return la,lo
              return None
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values():
                      yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          def txt(v):
              if v is None: return ""
              if scalar(v): return re.sub(r"\s+"," ",str(v)).strip()
              return ""
          def first(d, keys):
              return txt(get_key(d,keys))
          def flatten_service_hints(d):
              hints={}
              for k,v in d.items():
                  kk=nk(k)
                  if any(w in kk for w in ("diesel","adblue","hvo","lng","cng","parking","wash","shower","toilet","restaurant","wifi")):
                      if scalar(v) and txt(v).lower() not in ("","0","false","no","none","null"):
                          hints[kk]=txt(v)
              return hints

          candidates=[]
          for f in files:
              try:
                  data=json.loads(f.read_text(encoding="utf-8"))
              except Exception:
                  continue
              for d in walk(data):
                  c=find_coords(d)
                  if not c: continue
                  # Reject obvious map viewport/metadata objects by requiring at least
                  # an identifier/name/address/city signal.
                  name=first(d,NAME_KEYS)
                  sid=first(d,ID_KEYS)
                  addr=first(d,ADDRESS_KEYS)
                  city=first(d,CITY_KEYS)
                  if not (name or sid or addr or city):
                      continue
                  candidates.append((d,c))

          stations=[]; seen=set()
          for d,(lat,lon) in candidates:
              # AS24 sometimes exposes real station records with missing GPS as 0,0.
              # Never publish them: they would appear in the Gulf of Guinea and are unusable.
              if abs(lat) < 1e-9 and abs(lon) < 1e-9:
                  continue
              sid=first(d,ID_KEYS)
              name=first(d,NAME_KEYS) or "AS24"
              addr=first(d,ADDRESS_KEYS)
              city=first(d,CITY_KEYS)
              country=first(d,COUNTRY_KEYS)
              if city and city.lower() not in addr.lower(): addr=(addr+" "+city).strip()
              if country and country.lower() not in addr.lower(): addr=(addr+" "+country).strip()
              key=(round(lat,6),round(lon,6), sid or name.lower())
              if key in seen: continue
              seen.add(key)
              stations.append({
                  "id":"as24-"+(sid or str(len(stations)+1)),
                  "lat":lat,"lng":lon,
                  "name":name,
                  "brand":"AS24",
                  "address":addr,
                  "cards":["as24"],
                  "services":flatten_service_hints(d),
                  "source":"AS24 official Station Finder"
              })

          # AS24 has several thousand sites. If discovery starts returning only a
          # partial page, stop rather than publish a deceptive database.
          if len(stations) < 1500:
              raise RuntimeError(f"Only {len(stations)} AS24 stations discovered; refusing to publish partial data")

          stations.sort(key=lambda x:(x["lat"],x["lng"],x["name"]))
          now=datetime.now(timezone.utc).isoformat()
          out={
              "schemaVersion":1,
              "network":"AS24",
              "generatedAt":now,
              "source":"https://network.as24.com/stationfinder/en/stations",
              "count":len(stations),
              "stations":stations
          }
          p=Path("offline/fuel_cards/as24.json")
          p.write_text(json.dumps(out,ensure_ascii=False,separators=(",",":")),encoding="utf-8")

          mf=Path("offline/fuel_cards/manifest.json")
          try: m=json.loads(mf.read_text(encoding="utf-8"))
          except Exception: m={"schemaVersion":1,"networks":{}}
          m["generatedAt"]=now
          m.setdefault("networks",{})["as24"]={"count":len(stations),"source":out["source"]}
          mf.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding="utf-8")
          print("AS24 stations:",len(stations))
          PY

      - name: Commit AS24 data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/fuel_cards/as24.json offline/fuel_cards/manifest.json
          if git diff --cached --quiet; then
            echo "No AS24 changes"
            exit 0
          fi
          git commit -m "Update official AS24 fuel-card network"
          git push



  build-shell:
    needs: build-as24
    if: ${{ always() && needs.build-as24.result != 'cancelled' }}
    runs-on: ubuntu-latest
    env:
      SHELL_CLIENT_ID: ${{ secrets.SHELL_CLIENT_ID }}
      SHELL_CLIENT_SECRET: ${{ secrets.SHELL_CLIENT_SECRET }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Shell collector
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests

      - name: Build Shell Card network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline/fuel_cards

          python - <<'PY'
          import json, math, os, re, time, uuid
          from pathlib import Path
          from datetime import datetime, timezone

          import requests

          CID=os.environ.get("SHELL_CLIENT_ID","").strip()
          SEC=os.environ.get("SHELL_CLIENT_SECRET","").strip()

          TARGET={"IT","FR","DE","CH","AT","BE","LU","NL","ES"}

          def clean(v):
              return re.sub(r"\s+"," ",str(v or "")).strip()

          def fnum(v):
              try:
                  x=float(v)
                  return x if math.isfinite(x) else None
              except Exception:
                  return None

          def valid_coord(lat,lon):
              lat=fnum(lat); lon=fnum(lon)
              if lat is None or lon is None: return False
              if not (-90 <= lat <= 90 and -180 <= lon <= 180): return False
              if abs(lat)<1e-9 and abs(lon)<1e-9: return False
              return True

          # ================================================================
          # MODE A — COMPLETE OFFICIAL B2B MOBILITY SITES API
          # Includes Shell network + roaming partner locations.
          # Used whenever the two GitHub secrets are configured.
          # ================================================================
          def build_b2b():
              sess=requests.Session()
              sess.headers.update({"User-Agent":"KnightTruckerNavy/fuel-network"})

              auth_urls=[
                  "https://api.shell.com/v2/oauth/token",
                  "https://api-test.shell.com/v2/oauth/token",
              ]
              token=None
              last=None
              for url in auth_urls:
                  try:
                      r=sess.post(
                          url,
                          data={
                              "client_id":CID,
                              "client_secret":SEC,
                              "grant_type":"client_credentials",
                          },
                          timeout=60,
                      )
                      if r.ok:
                          token=r.json().get("access_token")
                          if token: break
                      last=f"{url}: HTTP {r.status_code} {r.text[:300]}"
                  except Exception as e:
                      last=f"{url}: {e}"
              if not token:
                  raise RuntimeError("Shell OAuth failed: "+str(last))

              endpoint="https://api.shell.com/locations/v1/fuel"
              stations=[]
              seen=set()
              page=1

              while True:
                  params=[("page",page),("pageSize",250)]
                  for cc in sorted(TARGET):
                      params.append(("countryCode",cc))

                  r=sess.get(
                      endpoint,
                      params=params,
                      headers={
                          "Authorization":"Bearer "+token,
                          "RequestId":str(uuid.uuid4()),
                          "Accept":"application/json",
                      },
                      timeout=90,
                  )
                  r.raise_for_status()
                  payload=r.json()

                  # Official response shape: data.data = list
                  rows=payload
                  for key in ("data","data"):
                      if isinstance(rows,dict):
                          rows=rows.get(key,[])
                  if not isinstance(rows,list):
                      raise RuntimeError("Unexpected Shell B2B response shape")

                  print("Shell B2B page",page,"rows",len(rows))
                  if not rows:
                      break

                  for d in rows:
                      if not isinstance(d,dict): continue

                      lat=d.get("latitude")
                      lon=d.get("longitude")
                      if not valid_coord(lat,lon):
                          loc=d.get("location") or d.get("geo_location") or {}
                          if isinstance(loc,dict):
                              lat=loc.get("latitude",loc.get("lat"))
                              lon=loc.get("longitude",loc.get("lng",loc.get("lon")))
                      if not valid_coord(lat,lon):
                          continue
                      lat=float(lat); lon=float(lon)

                      cc=clean(d.get("country_code") or d.get("countryCode")).upper()
                      if cc and cc not in TARGET:
                          continue

                      sid=clean(
                          d.get("site_id") or d.get("siteId") or
                          d.get("id") or d.get("station_id") or d.get("stationId")
                      )
                      name=clean(
                          d.get("name") or d.get("site_name") or
                          d.get("siteName") or "Shell Card"
                      )
                      brand=clean(d.get("brand") or "Shell")
                      address=d.get("address")
                      if isinstance(address,dict):
                          address=clean(" ".join(
                              clean(address.get(k))
                              for k in ("street","street_address","postal_code","city","country")
                              if address.get(k)
                          ))
                      else:
                          address=clean(address)

                      key=(round(lat,6),round(lon,6),sid or name.lower())
                      if key in seen: continue
                      seen.add(key)

                      stations.append({
                          "id":"shell-"+(sid or str(len(stations)+1)),
                          "lat":lat,
                          "lng":lon,
                          "name":name,
                          "brand":brand,
                          "address":address,
                          "cards":["shell"],
                          "country":cc,
                          "partner":bool(d.get("partner",False)),
                          "networkGroup":clean(d.get("network_group") or d.get("networkGroup")),
                          "hgv":bool(d.get("truck_services") or d.get("truckServices")),
                          "source":"Shell B2B Mobility Sites official API",
                      })

                  if len(rows)<250:
                      break
                  page+=1
                  if page>1000:
                      raise RuntimeError("Shell B2B pagination safety stop")
                  time.sleep(0.08)

              if len(stations)<100:
                  raise RuntimeError(
                      f"Only {len(stations)} Shell B2B locations parsed; refusing to publish"
                  )
              return stations, endpoint, "official-b2b-shell-plus-roaming"

          # ================================================================
          # MODE B — PUBLIC SHELL RETAIL LOCATOR JSON API
          # No credentials required.
          #
          # This is the JSON backend used by Shell's public retail locator.
          # It gives the public Shell retail network. It does NOT pretend to
          # include every roaming partner accepted by Shell Card.
          # ================================================================
          GEO="https://shellretaillocator.geoapp.me/api/v2/locations/within_bounds"

          # Tight country-ish boxes reduce work and keep recursion stable.
          BOXES={
              "IT": (35.3,  6.4, 47.2, 18.8),
              "FR": (41.0, -5.5, 51.5,  9.8),
              "DE": (47.2,  5.5, 55.2, 15.6),
              "CH": (45.7,  5.8, 47.9, 10.7),
              "AT": (46.2,  9.4, 49.2, 17.3),
              "BE": (49.4,  2.4, 51.6,  6.5),
              "LU": (49.3,  5.6, 50.3,  6.7),
              "NL": (50.7,  3.2, 53.7,  7.4),
              "ES": (35.7, -9.7, 43.9,  4.6),
          }

          sess=requests.Session()
          sess.headers.update({
              "User-Agent":"KnightTruckerNavy/1.0 (+GitHub Actions fuel-card updater)",
              "Accept":"application/json,text/plain,*/*",
          })

          def get_box(box, depth=0):
              south,west,north,east=box
              params=[
                  ("sw[]",south),("sw[]",west),
                  ("ne[]",north),("ne[]",east),
                  ("with_any[fuel_type][]","conventional"),
                  ("locale","en_GB"),
                  ("format","json"),
                  ("driving_distances","false"),
              ]
              last=None
              for attempt in range(5):
                  try:
                      r=sess.get(GEO,params=params,timeout=45)
                      if r.status_code in (429,500,502,503,504):
                          last=f"HTTP {r.status_code}"
                          time.sleep(2.0*(attempt+1))
                          continue
                      r.raise_for_status()
                      return r.json()
                  except Exception as e:
                      last=e
                      time.sleep(2.0*(attempt+1))
              raise RuntimeError(f"Shell locator request failed after retries: {last}")

          def split_box(box):
              s,w,n,e=box
              my=(s+n)/2.0
              mx=(w+e)/2.0
              return [
                  (s,w,my,mx),
                  (s,mx,my,e),
                  (my,w,n,mx),
                  (my,mx,n,e),
              ]

          def discover(box, depth=0):
              payload=get_box(box,depth)
              locs=payload.get("locations") or []
              clusters=payload.get("clusters") or []

              if locs:
                  return locs

              if clusters:
                  if depth>=10:
                      raise RuntimeError(
                          "Shell locator still clustered at recursion depth 10"
                      )
                  rows=[]
                  for sub in split_box(box):
                      rows.extend(discover(sub,depth+1))
                      time.sleep(0.03)
                  return rows

              return []

          def public_network():
              raw=[]
              for cc,box in BOXES.items():
                  rows=discover(box)
                  print("Shell public",cc,"raw rows",len(rows))
                  raw.extend((cc,r) for r in rows)

              stations=[]
              seen=set()

              for default_cc,d in raw:
                  if not isinstance(d,dict): continue

                  lat=d.get("lat",d.get("latitude"))
                  lon=d.get("lng",d.get("longitude"))
                  if not valid_coord(lat,lon):
                      continue
                  lat=float(lat); lon=float(lon)

                  cc=clean(
                      d.get("country_code") or d.get("countryCode") or default_cc
                  ).upper()
                  if cc not in TARGET:
                      continue

                  sid=clean(d.get("id") or d.get("location_id") or d.get("locationId"))
                  name=clean(d.get("name") or "Shell")
                  brand=clean(d.get("brand") or "Shell")
                  address=clean(d.get("address"))
                  city=clean(d.get("city"))
                  postcode=clean(d.get("postcode") or d.get("postal_code"))
                  if city and city.lower() not in address.lower():
                      address=(address+" "+city).strip()
                  if postcode and postcode.lower() not in address.lower():
                      address=(address+" "+postcode).strip()

                  # A record returned by this Shell-branded public locator is
                  # useful as a no-credential fallback for Shell Card searches,
                  # but we explicitly mark it as public-network coverage only.
                  key=(sid or "",round(lat,6),round(lon,6))
                  if key in seen: continue
                  seen.add(key)

                  sitecat=clean(d.get("site_category") or d.get("siteCategory"))
                  stations.append({
                      "id":"shell-"+(sid or str(len(stations)+1)),
                      "lat":lat,
                      "lng":lon,
                      "name":name,
                      "brand":brand,
                      "address":address,
                      "cards":["shell"],
                      "country":cc,
                      "siteCategory":sitecat,
                      "hgv":any(x in json.dumps(d,ensure_ascii=False).lower()
                                for x in ("truck","hgv","lkw","camion")),
                      "source":"Shell official public retail locator backend",
                  })

              if len(stations)<100:
                  raise RuntimeError(
                      f"Only {len(stations)} Shell public locations parsed; refusing to publish"
                  )
              return stations, GEO, "official-public-shell-network"

          if CID and SEC:
              print("Shell mode: official B2B API (Shell + roaming)")
              stations,source,coverage=build_b2b()
          else:
              print("Shell mode: official public locator backend (no credentials)")
              stations,source,coverage=public_network()

          stations.sort(key=lambda x:(x.get("country",""),x["lat"],x["lng"],x["name"]))

          now=datetime.now(timezone.utc).isoformat()
          out={
              "schemaVersion":1,
              "network":"SHELL",
              "generatedAt":now,
              "source":source,
              "coverage":coverage,
              "scopeCountries":sorted(TARGET),
              "count":len(stations),
              "stations":stations,
          }

          Path("offline/fuel_cards/shell.json").write_text(
              json.dumps(out,ensure_ascii=False,separators=(",",":")),
              encoding="utf-8",
          )

          mf=Path("offline/fuel_cards/manifest.json")
          try:
              manifest=json.loads(mf.read_text(encoding="utf-8"))
          except Exception:
              manifest={"schemaVersion":1,"networks":{}}

          manifest["generatedAt"]=now
          manifest.setdefault("networks",{})["shell"]={
              "count":len(stations),
              "source":source,
              "coverage":coverage,
          }
          mf.write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2),
              encoding="utf-8",
          )

          print("Shell stations:",len(stations))
          print("Shell coverage:",coverage)
          PY

      - name: Commit Shell data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/fuel_cards/shell.json offline/fuel_cards/manifest.json
          if git diff --cached --quiet; then
            echo "No Shell changes"
            exit 0
          fi
          git commit -m "Update Shell fuel-card network"
          git push
