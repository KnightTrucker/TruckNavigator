name: Build offline Europe service areas

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: write

concurrency:
  group: offline-europe-service-areas
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================
  # FASE 1
  # Estrae le aree di servizio e salva SUBITO il JSON intermedio.
  # Se la fase grafo dovesse avere problemi, questo lavoro non
  # viene perso.
  # ============================================================
  extract:
    name: extract (${{ matrix.cc }}, ${{ matrix.slug }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {cc: IT, slug: italy}
          - {cc: FR, slug: france}
          - {cc: DE, slug: germany}
          - {cc: CH, slug: switzerland}
          - {cc: AT, slug: austria}
          - {cc: BE, slug: belgium}
          - {cc: LU, slug: luxembourg}
          - {cc: NL, slug: netherlands}
          - {cc: ES, slug: spain}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium

      - name: Prepare folders
        run: |
          mkdir -p .osm
          mkdir -p offline/service_areas

      - name: Download ${{ matrix.cc }}
        shell: bash
        run: |
          set -euo pipefail

          URL="https://download.geofabrik.de/europe/${{ matrix.slug }}-latest.osm.pbf"
          OUT=".osm/${{ matrix.cc }}.osm.pbf"

          echo "Download: $URL"

          # curl robusto: più retry e ripresa del download quando possibile
          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 30 \
            --continue-at - \
            "$URL" \
            --output "$OUT"

          test -s "$OUT"
          ls -lh "$OUT"

      - name: Extract strict service areas
        shell: bash
        run: |
          set -euo pipefail

          python tools/offline_services/build_service_areas_europe.py \
            "${{ matrix.cc }}" \
            "offline/service_areas/${{ matrix.cc }}.json" \
            ".osm/${{ matrix.cc }}.osm.pbf"

          test -s "offline/service_areas/${{ matrix.cc }}.json"

      # SALVATAGGIO IMMEDIATO:
      # prima il vecchio workflow arrivava qui solo dopo il grafo.
      - name: Save extracted service areas
        uses: actions/upload-artifact@v4
        with:
          name: service-areas-base-${{ matrix.cc }}
          path: offline/service_areas/${{ matrix.cc }}.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6


  # ============================================================
  # FASE 2
  # Costruisce il collegamento alla topologia autostradale.
  # Parte dal JSON già salvato nella FASE 1.
  # Un eventuale rerun dei job falliti non perde l'estrazione.
  # ============================================================
  graph:
    name: graph (${{ matrix.cc }}, ${{ matrix.slug }})
    needs: extract
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {cc: IT, slug: italy}
          - {cc: FR, slug: france}
          - {cc: DE, slug: germany}
          - {cc: CH, slug: switzerland}
          - {cc: AT, slug: austria}
          - {cc: BE, slug: belgium}
          - {cc: LU, slug: luxembourg}
          - {cc: NL, slug: netherlands}
          - {cc: ES, slug: spain}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium

      - name: Prepare folders
        run: |
          mkdir -p .osm
          mkdir -p offline/service_areas

      - name: Download extracted JSON
        uses: actions/download-artifact@v4
        with:
          name: service-areas-base-${{ matrix.cc }}
          path: offline/service_areas

      - name: Verify extracted JSON
        run: |
          test -s "offline/service_areas/${{ matrix.cc }}.json"
          ls -lh "offline/service_areas/${{ matrix.cc }}.json"

      - name: Download ${{ matrix.cc }} topology source
        shell: bash
        run: |
          set -euo pipefail

          URL="https://download.geofabrik.de/europe/${{ matrix.slug }}-latest.osm.pbf"
          OUT=".osm/${{ matrix.cc }}.osm.pbf"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 30 \
            --continue-at - \
            "$URL" \
            --output "$OUT"

          test -s "$OUT"
          ls -lh "$OUT"

      - name: Link to motorway topology - attempt 1
        id: graph_try_1
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          rm -f "offline/service_areas/${{ matrix.cc }}.graph.json"

          python tools/offline_services/build_service_graph_europe.py \
            "offline/service_areas/${{ matrix.cc }}.json" \
            "offline/service_areas/${{ matrix.cc }}.graph.json" \
            ".osm/${{ matrix.cc }}.osm.pbf"

          test -s "offline/service_areas/${{ matrix.cc }}.graph.json"

      - name: Cooldown before retry
        if: steps.graph_try_1.outcome != 'success'
        run: |
          echo "Primo tentativo fallito. Attendo 30 secondi e riprovo."
          sleep 30

      - name: Link to motorway topology - attempt 2
        if: steps.graph_try_1.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail

          rm -f "offline/service_areas/${{ matrix.cc }}.graph.json"

          python tools/offline_services/build_service_graph_europe.py \
            "offline/service_areas/${{ matrix.cc }}.json" \
            "offline/service_areas/${{ matrix.cc }}.graph.json" \
            ".osm/${{ matrix.cc }}.osm.pbf"

          test -s "offline/service_areas/${{ matrix.cc }}.graph.json"

      - name: Final graph validation
        shell: bash
        run: |
          set -euo pipefail

          FILE="offline/service_areas/${{ matrix.cc }}.graph.json"

          test -s "$FILE"

          python - "$FILE" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("Graph JSON non valido")

          if "count" not in data:
              raise SystemExit("Campo count mancante")

          print("VALID:", path)
          print("count =", data.get("count"))
          print("linked =", data.get("graphLinking", {}).get("linked"))
          PY

      - name: Save completed graph
        uses: actions/upload-artifact@v4
        with:
          name: service-areas-graph-${{ matrix.cc }}
          path: |
            offline/service_areas/${{ matrix.cc }}.json
            offline/service_areas/${{ matrix.cc }}.graph.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6


  # ============================================================
  # FASE 3
  # Pubblica i risultati.
  #
  # IMPORTANTISSIMO:
  # il checkout contiene già i database dell'ultima esecuzione
  # riuscita. I nuovi artifact vengono sovrapposti.
  # Quindi un paese non deve mai sparire dal database perché
  # l'aggiornamento di quella settimana ha avuto un problema.
  # ============================================================
  publish:
    name: publish databases
    needs: graph
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout current databases
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download completed graphs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: service-areas-graph-*
          merge-multiple: true
          path: offline/service_areas

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show available databases
        shell: bash
        run: |
          echo "Database disponibili prima del manifest:"
          find offline/service_areas -maxdepth 1 -type f -name "*.graph.json" -print | sort || true

      - name: Build Europe manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/offline_services/build_europe_manifest.py

      - name: Validate Europe manifest
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          expected = {"IT","FR","DE","CH","AT","BE","LU","NL","ES"}
          p = Path("offline/service_areas/manifest_europe.json")

          if not p.exists():
              raise SystemExit("manifest_europe.json mancante")

          data = json.loads(p.read_text(encoding="utf-8"))
          found = set(data.get("countries", {}).keys())

          missing = sorted(expected - found)

          print("Paesi nel manifest:", ", ".join(sorted(found)))

          if missing:
              raise SystemExit(
                  "NON PUBBLICO: mancano database per: " + ", ".join(missing)
              )

          print("Manifest completo: 9/9 paesi")
          PY

      - name: Commit databases
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add offline/service_areas/

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi

          git commit -m "Update Europe offline service areas"

          # Evita un errore se nel frattempo main ha ricevuto un commit.
          for ATTEMPT in 1 2 3; do
            if git push; then
              echo "Push completato."
              exit 0
            fi

            echo "Push fallito, tentativo $ATTEMPT/3. Riallineo main..."
            git pull --rebase origin main
            sleep 10
          done

          echo "Push fallito dopo 3 tentativi."
          exit 1
