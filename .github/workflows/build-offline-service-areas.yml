name: Build offline France service areas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip osmium
      - name: Download extracts
        run: |
          mkdir -p .osm
          for r in ile-de-france champagne-ardenne lorraine alsace; do curl -fL --retry 4 "https://download.geofabrik.de/europe/france/$r-latest.osm.pbf" -o ".osm/$r.osm.pbf"; done
      - name: Build database
        run: |
          mkdir -p offline/service_areas
          python tools/offline_services/build_service_areas.py offline/service_areas/FR.json .osm/ile-de-france.osm.pbf .osm/champagne-ardenne.osm.pbf .osm/lorraine.osm.pbf .osm/alsace.osm.pbf
      - name: Link graph phase 2C optimized
        run: |
          python tools/offline_services/build_service_graph.py offline/service_areas/FR.json offline/service_areas/FR.graph.json .osm/ile-de-france.osm.pbf .osm/champagne-ardenne.osm.pbf .osm/lorraine.osm.pbf .osm/alsace.osm.pbf
      - name: Certify A4 topology phase 2D
        run: |
          python tools/offline_services/validate_a4_phase2d.py offline/service_areas/FR.graph.json tools/offline_services/a4_baseline.json offline/service_areas/a4_report.json
          python tools/offline_services/audit_a4_phase2d.py offline/service_areas/a4_report.json offline/service_areas/a4_certification.json
      - name: Orient A4 carriageways phase 2E
        run: |
          python tools/offline_services/orient_a4_phase2e.py \
            offline/service_areas/a4_report.json \
            offline/service_areas/a4_direction_report.json \
            .osm/ile-de-france.osm.pbf \
            .osm/champagne-ardenne.osm.pbf \
            .osm/lorraine.osm.pbf \
            .osm/alsace.osm.pbf
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/service_areas/FR.json offline/service_areas/FR.graph.json offline/service_areas/a4_report.json offline/service_areas/a4_certification.json offline/service_areas/a4_direction_report.json
          git diff --cached --quiet || (git commit -m "Orient A4 service areas phase 2E" && git push)
