name: Build Fuel Card Networks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 2'

permissions:
  contents: write

jobs:
  build-dkv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build DKV official network JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline/fuel_cards .tmp_dkv
          python - <<'PY'
          import io, json, os, re, urllib.request, zipfile
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          URL = 'https://my.dkv-mobility.com/apidnext/geo-static-content-service/v1/station-network,zip/dkv_standard_gpx.zip'
          req = urllib.request.Request(URL, headers={'User-Agent':'KnightTruckerNavy/0.0.60'})
          with urllib.request.urlopen(req, timeout=90) as r:
              payload = r.read()
          if len(payload) < 1000:
              raise RuntimeError('DKV download unexpectedly small')

          z = zipfile.ZipFile(io.BytesIO(payload))
          gpx_names = [n for n in z.namelist() if n.lower().endswith('.gpx')]
          if not gpx_names:
              raise RuntimeError('No GPX file in DKV ZIP')

          def local(tag):
              return tag.rsplit('}',1)[-1].lower()
          def text_of(el, name):
              for ch in list(el):
                  if local(ch.tag)==name and ch.text:
                      return ch.text.strip()
              return ''
          def all_text(el):
              vals=[]
              for ch in el.iter():
                  if ch.text and ch.text.strip(): vals.append(ch.text.strip())
              return ' | '.join(vals)
          def compact_ws(s):
              return re.sub(r'\s+',' ',s or '').strip()

          seen=set(); stations=[]
          for gn in gpx_names:
              root=ET.fromstring(z.read(gn))
              for w in root.iter():
                  if local(w.tag)!='wpt':
                      continue
                  try:
                      lat=float(w.attrib['lat']); lon=float(w.attrib['lon'])
                  except Exception:
                      continue
                  name=compact_ws(text_of(w,'name')) or 'DKV station'
                  desc=compact_ws(text_of(w,'desc'))
                  cmt=compact_ws(text_of(w,'cmt'))
                  full=compact_ws(' | '.join([name,desc,cmt,all_text(w)]))
                  key=(round(lat,6),round(lon,6),name.lower())
                  if key in seen: continue
                  seen.add(key)

                  # GPX exports differ slightly over time. Keep useful source text,
                  # but never invent acceptance: every point in this file is DKV network data.
                  address=''
                  m=re.search(r'(?:address|adresse|indirizzo)\s*[:=-]\s*([^|]+)', full, re.I)
                  if m: address=compact_ws(m.group(1))
                  brand=''
                  for b in ['TotalEnergies','Shell','Esso','BP','AS24','AVIA','Eni','Q8','Tamoil']:
                      if re.search(r'\b'+re.escape(b)+r'\b', full, re.I):
                          brand=b; break

                  stations.append({
                      'id': f'dkv-{len(stations)+1}',
                      'lat': lat,
                      'lng': lon,
                      'name': name,
                      'brand': brand,
                      'address': address or desc or cmt,
                      'cards': ['dkv'],
                      'source': 'DKV Mobility official POI',
                      'sourceText': full[:700]
                  })

          stations.sort(key=lambda x:(x['lat'],x['lng'],x['name']))
          if len(stations) < 1000:
              raise RuntimeError(f'Only {len(stations)} DKV points parsed; refusing to publish')

          out={
              'schemaVersion':1,
              'network':'DKV',
              'generatedAt':datetime.now(timezone.utc).isoformat(),
              'source':URL,
              'count':len(stations),
              'stations':stations
          }
          os.makedirs('offline/fuel_cards', exist_ok=True)
          with open('offline/fuel_cards/dkv.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          with open('offline/fuel_cards/manifest.json','w',encoding='utf-8') as f:
              json.dump({'schemaVersion':1,'generatedAt':out['generatedAt'],'networks':{'dkv':{'count':len(stations),'source':URL}}},f,ensure_ascii=False,indent=2)
          print('DKV stations:',len(stations))
          PY

      - name: Commit generated DKV data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/fuel_cards/dkv.json offline/fuel_cards/manifest.json
          if git diff --cached --quiet; then
            echo "No DKV changes"
            exit 0
          fi
          git commit -m "Update official DKV fuel-card network"
          git push

  build-as24:
    needs: build-dkv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install AS24 collector
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture official AS24 Station Finder data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp_as24 offline/fuel_cards
          cat > .tmp_as24/capture.py <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          URL="https://network.as24.com/stationfinder/en/stations"
          OUT=Path(".tmp_as24/responses")
          OUT.mkdir(parents=True, exist_ok=True)

          def looks_json(ct, txt):
              ct=(ct or "").lower()
              t=(txt or "").lstrip()
              return ("json" in ct) or t.startswith("{") or t.startswith("[")

          async def main():
              saved=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  page=await browser.new_page()

                  async def handle(resp):
                      try:
                          if resp.request.resource_type not in ("xhr","fetch","document"):
                              return
                          txt=await resp.text()
                          if len(txt)<100 or not looks_json(resp.headers.get("content-type",""), txt):
                              return
                          # Save every official JSON/XHR response. The parser below decides
                          # which payload actually contains the station collection.
                          fn=OUT/f"{len(saved):04d}.json"
                          fn.write_text(txt, encoding="utf-8")
                          saved.append((str(fn), resp.url, len(txt)))
                      except Exception:
                          pass

                  page.on("response", handle)
                  await page.goto(URL, wait_until="domcontentloaded", timeout=120000)

                  for label in ["Accept all","Accept","I agree","Allow all"]:
                      try:
                          b=page.get_by_role("button", name=label, exact=False)
                          if await b.count():
                              await b.first.click(timeout=2500)
                              break
                      except Exception:
                          pass

                  # Give the map/list time to load its backing dataset.
                  await page.wait_for_timeout(15000)

                  # Force a modest interaction so lazy-loaded station requests fire too.
                  try:
                      await page.mouse.wheel(0, 1800)
                      await page.wait_for_timeout(5000)
                  except Exception:
                      pass

                  # Save embedded state as a second official source when present.
                  try:
                      state=await page.evaluate("""() => {
                        const out={};
                        for (const k of ['__NEXT_DATA__','__NUXT__']) {
                          if (window[k]) out[k]=window[k];
                        }
                        return out;
                      }""")
                      if state:
                          (OUT/"embedded-state.json").write_text(
                              json.dumps(state, ensure_ascii=False), encoding="utf-8")
                  except Exception:
                      pass

                  print("Captured official AS24 responses:", len(saved))
                  for item in sorted(saved, key=lambda x:x[2], reverse=True)[:12]:
                      print(item[2], item[1])
                  await browser.close()

          asyncio.run(main())
          PY
          python .tmp_as24/capture.py

      - name: Build AS24 network JSON from captured official data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, re
          from pathlib import Path
          from datetime import datetime, timezone

          ROOT=Path(".tmp_as24/responses")
          files=list(ROOT.glob("*.json"))
          if not files:
              raise RuntimeError("AS24 Station Finder returned no JSON payloads")

          LAT_KEYS=("lat","latitude","y")
          LON_KEYS=("lng","lon","long","longitude","x")
          NAME_KEYS=("name","stationname","station_name","title","label","commercialname","commercial_name")
          ID_KEYS=("id","stationid","station_id","siteid","site_id","code","stationnumber","station_number")
          ADDRESS_KEYS=("address","adresse","street","streetaddress","street_address","formattedaddress","formatted_address")
          CITY_KEYS=("city","town","locality","ville")
          COUNTRY_KEYS=("country","countrycode","country_code","pays")

          def nk(s): return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def scalar(v):
              return isinstance(v,(str,int,float,bool)) or v is None
          def asnum(v):
              try:
                  if isinstance(v,str): v=v.strip().replace(",",".")
                  return float(v)
              except Exception:
                  return None
          def get_key(d, candidates):
              if not isinstance(d,dict): return None
              by={nk(k):k for k in d}
              for c in candidates:
                  nc=nk(c)
                  if nc in by: return d[by[nc]]
              return None
          def find_coords(d):
              lat=get_key(d,LAT_KEYS); lon=get_key(d,LON_KEYS)
              la,lo=asnum(lat),asnum(lon)
              if la is not None and lo is not None and -90<=la<=90 and -180<=lo<=180:
                  return la,lo
              # common GeoJSON form
              g=get_key(d,("geometry","location","position","coordinates"))
              if isinstance(g,dict):
                  c=get_key(g,("coordinates",))
                  if isinstance(c,list) and len(c)>=2:
                      lo,la=asnum(c[0]),asnum(c[1])
                      if la is not None and lo is not None and -90<=la<=90 and -180<=lo<=180:
                          return la,lo
                  la=get_key(g,LAT_KEYS); lo=get_key(g,LON_KEYS)
                  la,lo=asnum(la),asnum(lo)
                  if la is not None and lo is not None and -90<=la<=90 and -180<=lo<=180:
                      return la,lo
              if isinstance(g,list) and len(g)>=2:
                  lo,la=asnum(g[0]),asnum(g[1])
                  if la is not None and lo is not None and -90<=la<=90 and -180<=lo<=180:
                      return la,lo
              return None
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values():
                      yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          def txt(v):
              if v is None: return ""
              if scalar(v): return re.sub(r"\s+"," ",str(v)).strip()
              return ""
          def first(d, keys):
              return txt(get_key(d,keys))
          def flatten_service_hints(d):
              hints={}
              for k,v in d.items():
                  kk=nk(k)
                  if any(w in kk for w in ("diesel","adblue","hvo","lng","cng","parking","wash","shower","toilet","restaurant","wifi")):
                      if scalar(v) and txt(v).lower() not in ("","0","false","no","none","null"):
                          hints[kk]=txt(v)
              return hints

          candidates=[]
          for f in files:
              try:
                  data=json.loads(f.read_text(encoding="utf-8"))
              except Exception:
                  continue
              for d in walk(data):
                  c=find_coords(d)
                  if not c: continue
                  # Reject obvious map viewport/metadata objects by requiring at least
                  # an identifier/name/address/city signal.
                  name=first(d,NAME_KEYS)
                  sid=first(d,ID_KEYS)
                  addr=first(d,ADDRESS_KEYS)
                  city=first(d,CITY_KEYS)
                  if not (name or sid or addr or city):
                      continue
                  candidates.append((d,c))

          stations=[]; seen=set()
          for d,(lat,lon) in candidates:
              # AS24 sometimes exposes real station records with missing GPS as 0,0.
              # Never publish them: they would appear in the Gulf of Guinea and are unusable.
              if abs(lat) < 1e-9 and abs(lon) < 1e-9:
                  continue
              sid=first(d,ID_KEYS)
              name=first(d,NAME_KEYS) or "AS24"
              addr=first(d,ADDRESS_KEYS)
              city=first(d,CITY_KEYS)
              country=first(d,COUNTRY_KEYS)
              if city and city.lower() not in addr.lower(): addr=(addr+" "+city).strip()
              if country and country.lower() not in addr.lower(): addr=(addr+" "+country).strip()
              key=(round(lat,6),round(lon,6), sid or name.lower())
              if key in seen: continue
              seen.add(key)
              stations.append({
                  "id":"as24-"+(sid or str(len(stations)+1)),
                  "lat":lat,"lng":lon,
                  "name":name,
                  "brand":"AS24",
                  "address":addr,
                  "cards":["as24"],
                  "services":flatten_service_hints(d),
                  "source":"AS24 official Station Finder"
              })

          # AS24 has several thousand sites. If discovery starts returning only a
          # partial page, stop rather than publish a deceptive database.
          if len(stations) < 1500:
              raise RuntimeError(f"Only {len(stations)} AS24 stations discovered; refusing to publish partial data")

          stations.sort(key=lambda x:(x["lat"],x["lng"],x["name"]))
          now=datetime.now(timezone.utc).isoformat()
          out={
              "schemaVersion":1,
              "network":"AS24",
              "generatedAt":now,
              "source":"https://network.as24.com/stationfinder/en/stations",
              "count":len(stations),
              "stations":stations
          }
          p=Path("offline/fuel_cards/as24.json")
          p.write_text(json.dumps(out,ensure_ascii=False,separators=(",",":")),encoding="utf-8")

          mf=Path("offline/fuel_cards/manifest.json")
          try: m=json.loads(mf.read_text(encoding="utf-8"))
          except Exception: m={"schemaVersion":1,"networks":{}}
          m["generatedAt"]=now
          m.setdefault("networks",{})["as24"]={"count":len(stations),"source":out["source"]}
          mf.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding="utf-8")
          print("AS24 stations:",len(stations))
          PY

      - name: Commit AS24 data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/fuel_cards/as24.json offline/fuel_cards/manifest.json
          if git diff --cached --quiet; then
            echo "No AS24 changes"
            exit 0
          fi
          git commit -m "Update official AS24 fuel-card network"
          git push


  build-shell:
    needs: build-as24
    if: ${{ always() && needs.build-as24.result != 'cancelled' }}
    runs-on: ubuntu-latest
    env:
      SHELL_CLIENT_ID: ${{ secrets.SHELL_CLIENT_ID }}
      SHELL_CLIENT_SECRET: ${{ secrets.SHELL_CLIENT_SECRET }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Shell collector
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Build verified Shell Card network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline/fuel_cards

          python - <<'PY'
          import json, os, re, time, uuid
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import urlencode, urljoin, urlparse
          from urllib.request import Request, urlopen

          import requests
          from bs4 import BeautifulSoup

          CID=os.environ.get("SHELL_CLIENT_ID","").strip()
          SEC=os.environ.get("SHELL_CLIENT_SECRET","").strip()

          # Countries currently supported by TruckNavigator fuel-card filtering.
          COUNTRIES={"it":"IT","fr":"FR","de":"DE","ch":"CH","at":"AT","be":"BE","lu":"LU","nl":"NL","es":"ES"}

          def text(v):
              return re.sub(r"\s+"," ",str(v or "")).strip()

          def valid_coord(lat,lon):
              try:
                  lat=float(lat); lon=float(lon)
              except Exception:
                  return False
              if not (-90 <= lat <= 90 and -180 <= lon <= 180):
                  return False
              if abs(lat) < 1e-9 and abs(lon) < 1e-9:
                  return False
              return True

          # ------------------------------------------------------------------
          # MODE A: complete official Shell B2B Mobility Sites API
          # Used automatically when GitHub secrets are configured.
          # ------------------------------------------------------------------
          def build_from_api():
              AUTH="https://api.shell.com/v2/oauth/token"
              SITES="https://api.shell.com/locations/v1/fuel"
              EUROPE=set(COUNTRIES.values())

              def call(req, timeout=90):
                  with urlopen(req, timeout=timeout) as r:
                      return json.loads(r.read().decode("utf-8"))

              body=urlencode({
                  "client_id":CID,
                  "client_secret":SEC,
                  "grant_type":"client_credentials"
              }).encode()
              tok=call(Request(AUTH,data=body,headers={
                  "Content-Type":"application/x-www-form-urlencoded",
                  "User-Agent":"KnightTruckerNavy/fuel-network"
              }))
              token=tok.get("access_token")
              if not token:
                  raise RuntimeError("Shell OAuth did not return access_token")

              def get_page(page):
                  u=f"{SITES}?page={page}&pageSize=250"
                  return call(Request(u,headers={
                      "Authorization":"Bearer "+token,
                      "RequestId":str(uuid.uuid4()),
                      "Accept":"application/json",
                      "User-Agent":"KnightTruckerNavy/fuel-network"
                  }))

              def locate_list(obj):
                  found=[]
                  def walk(x):
                      if isinstance(x,list) and x and isinstance(x[0],dict):
                          found.append(x)
                      if isinstance(x,dict):
                          for v in x.values(): walk(v)
                      elif isinstance(x,list):
                          for v in x: walk(v)
                  walk(obj)
                  return max(found,key=len) if found else []

              def nk(s): return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
              def first(d,*names):
                  if not isinstance(d,dict): return None
                  m={nk(k):v for k,v in d.items()}
                  for n in names:
                      if nk(n) in m and m[nk(n)] not in (None,""):
                          return m[nk(n)]
                  return None
              def num(v):
                  try:return float(v)
                  except:return None
              def coords(d):
                  la=num(first(d,"latitude","lat")); lo=num(first(d,"longitude","lng","lon"))
                  if valid_coord(la,lo): return la,lo
                  for k in ("location","geoLocation","geolocation","coordinates","geometry"):
                      g=first(d,k)
                      if isinstance(g,dict):
                          la=num(first(g,"latitude","lat")); lo=num(first(g,"longitude","lng","lon"))
                          if valid_coord(la,lo): return la,lo
                          c=first(g,"coordinates")
                          if isinstance(c,list) and len(c)>=2:
                              lo,la=num(c[0]),num(c[1])
                              if valid_coord(la,lo): return la,lo
                  return None

              allrows=[]
              page=1
              while True:
                  payload=get_page(page)
                  rows=locate_list(payload)
                  if not rows: break
                  allrows.extend(rows)
                  print("Shell API page",page,"rows",len(rows))
                  if len(rows)<250: break
                  page+=1
                  if page>2000: raise RuntimeError("Shell API pagination safety stop")
                  time.sleep(0.08)

              stations=[]; seen=set()
              for d in allrows:
                  c=coords(d)
                  if not c: continue
                  lat,lon=c
                  cc=text(first(d,"countryCode","country_code","country")).upper()
                  if cc and cc not in EUROPE: continue
                  sid=text(first(d,"siteId","site_id","id","stationId","station_id"))
                  name=text(first(d,"siteName","site_name","name","displayName")) or "Shell Card"
                  brand=text(first(d,"brand","brandName","networkName")) or "Shell"
                  addr=text(first(d,"address","formattedAddress","streetAddress"))
                  city=text(first(d,"city","town","locality"))
                  if city and city.lower() not in addr.lower(): addr=(addr+" "+city).strip()
                  key=(round(lat,6),round(lon,6),sid or name.lower())
                  if key in seen: continue
                  seen.add(key)
                  stations.append({
                      "id":"shell-"+(sid or str(len(stations)+1)),
                      "lat":lat,"lng":lon,
                      "name":name,
                      "brand":brand,
                      "address":addr,
                      "cards":["shell"],
                      "country":cc,
                      "cardAcceptance":"official-b2b-network",
                      "source":"Shell B2B Mobility Sites official API"
                  })

              if len(stations)<100:
                  raise RuntimeError(f"Only {len(stations)} Shell/roaming sites parsed from API; refusing to publish")
              return stations, SITES, "official-api-complete"

          # ------------------------------------------------------------------
          # MODE B: official PUBLIC Shell Station Locator fallback.
          # No credentials required.
          #
          # Important: a public Shell location is included ONLY when its own
          # station page explicitly declares Shell Card/euroShell acceptance.
          # This gives a verified subset. Roaming partner sites not exposed by
          # the public Shell locator require Mode A.
          # ------------------------------------------------------------------
          CARD_MARKERS=[
              "euroshell/shell card",
              "shell fuel card acceptance",
              "shell card (b2b)",
              "smartpay - shell card (b2b)",
              "shell card b2b",
          ]

          def extract_jsonld(soup):
              objs=[]
              for tag in soup.find_all("script", attrs={"type":"application/ld+json"}):
                  raw=tag.string or tag.get_text() or ""
                  try:
                      v=json.loads(raw)
                  except Exception:
                      continue
                  if isinstance(v,list): objs.extend(v)
                  else: objs.append(v)
              return objs

          def walk_dicts(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk_dicts(v)
              elif isinstance(x,list):
                  for v in x: yield from walk_dicts(v)

          def page_station(url, session, cc):
              r=session.get(url,timeout=35,allow_redirects=True)
              r.raise_for_status()
              html=r.text
              low=re.sub(r"\s+"," ",BeautifulSoup(html,"html.parser").get_text(" ",strip=True)).lower()
              if not any(m in low for m in CARD_MARKERS):
                  return None

              soup=BeautifulSoup(html,"html.parser")
              name=""
              h1=soup.find("h1")
              if h1: name=text(h1.get_text(" ",strip=True))

              lat=lon=None
              addr=""
              for root in extract_jsonld(soup):
                  for d in walk_dicts(root):
                      geo=d.get("geo") if isinstance(d,dict) else None
                      if isinstance(geo,dict):
                          la=geo.get("latitude"); lo=geo.get("longitude")
                          if valid_coord(la,lo):
                              lat=float(la); lon=float(lo)
                      if lat is None:
                          la=d.get("latitude") if isinstance(d,dict) else None
                          lo=d.get("longitude") if isinstance(d,dict) else None
                          if valid_coord(la,lo):
                              lat=float(la); lon=float(lo)
                      if not name and isinstance(d,dict) and d.get("name"):
                          name=text(d.get("name"))
                      if not addr and isinstance(d,dict):
                          a=d.get("address")
                          if isinstance(a,dict):
                              parts=[a.get("streetAddress"),a.get("postalCode"),a.get("addressLocality"),a.get("addressCountry")]
                              addr=text(" ".join(text(x) for x in parts if x))
                          elif isinstance(a,str):
                              addr=text(a)

              # Fallback coordinates from embedded page state.
              if lat is None:
                  pats=[
                      r'"latitude"\s*:\s*"?(-?\d+(?:\.\d+)?)"?\s*,\s*"longitude"\s*:\s*"?(-?\d+(?:\.\d+)?)"?',
                      r'"lat"\s*:\s*"?(-?\d+(?:\.\d+)?)"?\s*,\s*"(?:lng|lon)"\s*:\s*"?(-?\d+(?:\.\d+)?)"?',
                  ]
                  for p in pats:
                      m=re.search(p,html,re.I)
                      if m and valid_coord(m.group(1),m.group(2)):
                          lat=float(m.group(1)); lon=float(m.group(2)); break

              if not valid_coord(lat,lon):
                  print("Shell locator station skipped: no valid coordinates",url)
                  return None

              # Location Details text fallback for address.
              if not addr:
                  heading=soup.find(lambda t: t.name in ("h2","h3") and "location details" in t.get_text(" ",strip=True).lower())
                  if heading:
                      nxt=heading.find_next()
                      if nxt: addr=text(nxt.get_text(" ",strip=True))

              sid=""
              m=re.search(r"/fuel/(\d+)-",url)
              if m: sid=m.group(1)

              truck=any(s in low for s in [
                  "truck friendly","accessible aux camions","lkw","camion","truck parking",
                  "adblue pump truck","adblue pour camions"
              ])

              return {
                  "id":"shell-"+(sid or str(abs(hash(url)))),
                  "lat":float(lat),"lng":float(lon),
                  "name":name or "Shell",
                  "brand":"Shell",
                  "address":addr,
                  "cards":["shell"],
                  "country":cc,
                  "hgv":truck,
                  "cardAcceptance":"explicit-public-locator",
                  "source":"Shell official public Station Locator",
                  "sourceUrl":url
              }

          def build_from_public_locator():
              s=requests.Session()
              s.headers.update({
                  "User-Agent":"KnightTruckerNavy/1.0 (+GitHub Actions fuel-card updater)",
                  "Accept-Language":"en-US,en;q=0.8"
              })
              station_urls=set()

              for country,cc in COUNTRIES.items():
                  root=f"https://find.shell.com/{country}/fuel/locations/en_US"
                  print("Shell public locator country:",country,root)
                  try:
                      r=s.get(root,timeout=40)
                      r.raise_for_status()
                  except Exception as e:
                      print("Country index failed:",country,e)
                      continue
                  soup=BeautifulSoup(r.text,"html.parser")

                  # Country page -> city pages.
                  city_urls=set()
                  for a in soup.find_all("a",href=True):
                      u=urljoin(root,a["href"]).split("#")[0]
                      p=urlparse(u)
                      if p.netloc=="find.shell.com" and f"/{country}/fuel/locations/" in p.path:
                          city_urls.add(u)

                  # Some markets may expose station links directly on country page.
                  for a in soup.find_all("a",href=True):
                      u=urljoin(root,a["href"]).split("#")[0]
                      p=urlparse(u)
                      if p.netloc=="find.shell.com" and re.search(fr"/{country}/fuel/\d+-",p.path):
                          station_urls.add(u)

                  print(country,"city pages",len(city_urls))
                  for i,city_url in enumerate(sorted(city_urls),1):
                      try:
                          rr=s.get(city_url,timeout=35)
                          rr.raise_for_status()
                          ss=BeautifulSoup(rr.text,"html.parser")
                          for a in ss.find_all("a",href=True):
                              u=urljoin(city_url,a["href"]).split("#")[0]
                              p=urlparse(u)
                              if p.netloc=="find.shell.com" and re.search(fr"/{country}/fuel/\d+-",p.path):
                                  # strip locale suffix so duplicates collapse
                                  bits=p.path.split("/")
                                  # keep through station slug
                                  try:
                                      fi=bits.index("fuel")
                                      path="/".join(bits[:fi+2])
                                      u=f"https://find.shell.com{path}"
                                  except Exception:
                                      pass
                                  station_urls.add(u)
                      except Exception as e:
                          print("City page failed:",city_url,e)
                      if i % 50 == 0:
                          print(country,"city pages processed",i,"stations discovered",len(station_urls))
                      time.sleep(0.03)

              print("Shell station pages discovered:",len(station_urls))
              if len(station_urls)<50:
                  raise RuntimeError("Shell public locator discovery returned too few station pages")

              stations=[]; seen=set()
              for i,u in enumerate(sorted(station_urls),1):
                  cc=COUNTRIES.get(urlparse(u).path.strip("/").split("/")[0],"")
                  try:
                      st=page_station(u,s,cc)
                  except Exception as e:
                      print("Station page failed:",u,e)
                      st=None
                  if st:
                      key=(round(st["lat"],6),round(st["lng"],6),st["id"])
                      if key not in seen:
                          seen.add(key); stations.append(st)
                  if i % 100 == 0:
                      print("Shell pages checked",i,"verified Shell Card",len(stations))
                  time.sleep(0.03)

              if len(stations)<25:
                  raise RuntimeError(f"Only {len(stations)} explicit Shell Card stations verified; refusing to publish")
              return stations, "https://find.shell.com/", "official-public-locator-verified-subset"

          if CID and SEC:
              print("Shell mode: official authenticated B2B Mobility Sites API")
              stations,source,coverage=build_from_api()
          else:
              print("Shell mode: official public Station Locator, explicit Shell Card acceptance only")
              stations,source,coverage=build_from_public_locator()

          stations.sort(key=lambda x:(x["country"],x["lat"],x["lng"],x["name"]))
          now=datetime.now(timezone.utc).isoformat()
          out={
              "schemaVersion":1,
              "network":"SHELL",
              "generatedAt":now,
              "source":source,
              "coverage":coverage,
              "scopeCountries":sorted(COUNTRIES.values()),
              "count":len(stations),
              "stations":stations
          }
          Path("offline/fuel_cards/shell.json").write_text(
              json.dumps(out,ensure_ascii=False,separators=(",",":")),encoding="utf-8")

          mf=Path("offline/fuel_cards/manifest.json")
          try:m=json.loads(mf.read_text(encoding="utf-8"))
          except Exception:m={"schemaVersion":1,"networks":{}}
          m["generatedAt"]=now
          m.setdefault("networks",{})["shell"]={
              "count":len(stations),
              "source":source,
              "coverage":coverage
          }
          mf.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding="utf-8")
          print("Shell verified stations:",len(stations),"coverage:",coverage)
          PY

      - name: Commit Shell data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/fuel_cards/shell.json offline/fuel_cards/manifest.json
          if git diff --cached --quiet; then
            echo "No Shell changes"
            exit 0
          fi
          git commit -m "Update verified Shell Card network"
          git push
