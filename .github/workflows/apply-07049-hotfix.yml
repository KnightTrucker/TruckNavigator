name: Apply KTN 0.70.49 Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply audited 0.70.49 hotfix
        run: python3 KTN_07049_HOTFIX.py .

      - name: Validate diff
        run: |
          git diff --check
          git diff -- index.html planner.html navigator.html sw.js

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html planner.html navigator.html sw.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: apply audited 0.70.49 navigation hotfix"
            git push
          fi
