name: Build offline Europe service areas

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: write

concurrency:
  group: offline-europe-service-areas
  cancel-in-progress: false

jobs:
  build:
    name: build Europe service areas
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install osmium Python module
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip install --user --upgrade osmium
          python3 - <<'PY'
          import osmium
          print("osmium OK")
          PY

      - name: Build all country databases sequentially
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .osm offline/service_areas

          build_country() {
            local cc="$1"
            local slug="$2"
            local pbf=".osm/${cc}.osm.pbf"
            local json="offline/service_areas/${cc}.json"
            local url="https://download.geofabrik.de/europe/${slug}-latest.osm.pbf"

            echo "========================================"
            echo "BUILD ${cc} from ${url}"
            echo "========================================"

            rm -f "$pbf" "$json"

            curl \
              --fail \
              --location \
              --retry 8 \
              --retry-all-errors \
              --retry-delay 10 \
              --connect-timeout 30 \
              "$url" \
              --output "$pbf"

            test -s "$pbf"
            ls -lh "$pbf"

            python3 tools/offline_services/build_service_areas_europe.py \
              "$cc" \
              "$pbf" \
              "$json"

            test -s "$json"

            python3 - "$json" "$cc" <<'PY'
          import json, sys
          path, cc = sys.argv[1], sys.argv[2]
          with open(path, "r", encoding="utf-8") as fh:
              data = json.load(fh)
          if data.get("country") != cc:
              raise SystemExit(f"country errato in {path}")
          areas = data.get("areas")
          if not isinstance(areas, list) or not areas:
              raise SystemExit(f"areas non valido/vuoto in {path}")
          if data.get("count") != len(areas):
              raise SystemExit(f"count incoerente in {path}")
          print(f"VALID {cc}: {len(areas)} aree")
          PY

            rm -f "$pbf"
            echo "DONE ${cc}"
          }

          build_country IT italy
          build_country FR france
          build_country DE germany
          build_country CH switzerland
          build_country AT austria
          build_country BE belgium
          build_country LU luxembourg
          build_country NL netherlands
          build_country ES spain

      - name: Remove obsolete graph files
        shell: bash
        run: |
          set -euo pipefail
          find offline/service_areas -maxdepth 1 -type f -name "*.graph.json" -print -delete || true

      - name: Build Europe manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/offline_services/build_europe_manifest.py
          test -s offline/service_areas/manifest_europe.json

      - name: Final validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = ["IT", "FR", "DE", "CH", "AT", "BE", "LU", "NL", "ES"]
          root = Path("offline/service_areas")

          for cc in expected:
              path = root / f"{cc}.json"
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Manca {path}")
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("country") != cc:
                  raise SystemExit(f"country errato: {cc}")
              areas = data.get("areas")
              if not isinstance(areas, list) or not areas:
                  raise SystemExit(f"areas vuoto: {cc}")
              if data.get("count") != len(areas):
                  raise SystemExit(f"count incoerente: {cc}")

          manifest_path = root / "manifest_europe.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          found = set(manifest.get("countries", {}).keys())
          if found != set(expected):
              raise SystemExit(f"Manifest incompleto: {sorted(found)}")
          if manifest.get("graphRequired") is not False:
              raise SystemExit("Manifest: graphRequired deve essere false")

          print("FINAL VALIDATION OK - 9/9 countries")
          PY

      - name: Commit databases
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A offline/service_areas/

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi

          git commit -m "Update Europe offline service areas"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push completato."
              exit 0
            fi
            echo "Push fallito: tentativo ${attempt}/3"
            git pull --rebase origin main
            sleep 10
          done

          echo "Push fallito dopo 3 tentativi."
          exit 1
