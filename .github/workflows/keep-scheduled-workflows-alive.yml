name: Keep scheduled workflows alive

on:
  workflow_dispatch:
  schedule:
    # Heartbeat mensile: mantiene attivo il repository pubblico ben sotto i 60 giorni.
    - cron: "17 4 1 * *"

permissions:
  contents: write

concurrency:
  group: keep-scheduled-workflows-alive
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update heartbeat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat/last-run.txt

      - name: Commit heartbeat
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat/last-run.txt

          if git diff --cached --quiet; then
            echo "Heartbeat invariato: nessun commit necessario."
            exit 0
          fi

          git commit -m "Monthly workflow heartbeat"

          for ATTEMPT in 1 2 3
          do
            if git push origin HEAD:main
            then
              echo "Heartbeat pubblicato."
              exit 0
            fi

            echo "Push fallito - tentativo ${ATTEMPT}/3"
            git pull --rebase origin main
            sleep 5
          done

          echo "ERRORE: impossibile pubblicare heartbeat."
          exit 1
