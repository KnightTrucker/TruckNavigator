<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KnightTruckerNavy 0.70.50</title>
<link rel="manifest" href="./manifest.json?v=7050">
<link rel="icon" href="./assets/ui/favicon.png" type="image/png">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07111c;color:#eef2f7;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 22%,#11263b 0,#07111c 42%,#04090e 100%)}
.card{width:min(430px,96vw);background:#1b1f2b;border:1px solid #343a50;border-radius:22px;padding:34px 26px;box-shadow:0 24px 70px rgba(0,0,0,.55);text-align:center}.logo{width:96px;height:96px;object-fit:contain;border-radius:6px}.title{font-size:clamp(32px,8vw,46px);font-weight:900;margin:20px 0 6px}.sub{color:#9aa3b7;font-size:16px}.ver{color:#7dd3fc;font-weight:900;font-size:19px;margin-top:9px}.state{color:#86efac;font-size:14px;margin:8px 0 24px}.btn{width:100%;padding:16px 14px;margin:8px 0;border-radius:11px;border:0;font-size:17px;font-weight:800;color:#fff;background:#ef4044}.btn.alt{background:#242938;border:1px solid #343a50}.btn:active{transform:scale(.99)}.hidden{display:none}.err{color:#fca5a5}.small{font-size:12px;color:#8b95a8;margin-top:12px}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="./assets/ui/logo.png" alt="KnightTruckerNavy" decoding="async">
<div class="title">KnightTruckerNavy</div>
<div class="sub">Scegli come avviare KnightTruckerNavy</div>
<div class="ver">VERSIONE 0.70.50</div>
<div id="state" class="state">PRONTO</div>
<button id="drive" class="btn" type="button">☁ Connetti Google Drive</button>
<button id="open" class="btn" type="button">📂 Apri file esistente</button>
<button id="skip" class="btn alt" type="button">✚ Inizia con lista vuota</button>
<input id="fileFallback" class="hidden" type="file" accept=".json,application/json">
<div class="small">Launcher indipendente: nessun modulo di navigazione viene caricato prima della scelta.</div>
</main>
<script>
(function(){
'use strict';
var state=document.getElementById('state'),busy=false;
function setState(t,err){state.textContent=t;state.className='state'+(err?' err':'')}
function go(mode){try{sessionStorage.setItem('ktn_launch_mode',mode)}catch(_e){}location.href='./planner.html?mode='+encodeURIComponent(mode)+'&v=7049'}
function openDb(name,ver,upgrade){return new Promise(function(res,rej){var r=indexedDB.open(name,ver);r.onupgradeneeded=function(){upgrade&&upgrade(r.result)};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
async function storePending(text,name){var db=await openDb('KTNLauncher',1,function(d){if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')});await new Promise(function(res,rej){var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put({text:text,name:name||'rubrica.json',at:Date.now()},'pendingImport');tx.oncomplete=res;tx.onerror=function(){rej(tx.error)}});db.close()}
async function storeHandle(handle){try{var db=await openDb('DistributoriFS',1,function(d){if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')});await new Promise(function(res,rej){var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(handle,'distFileHandle');tx.oncomplete=res;tx.onerror=function(){rej(tx.error)}});db.close()}catch(_e){}}
async function acceptFile(file,handle){try{setState('Lettura file…');var text=await file.text();JSON.parse(text);await storePending(text,file.name);if(handle)await storeHandle(handle);go('import')}catch(e){busy=false;setState('File non valido: '+(e&&e.message?e.message:e),true)}}

document.getElementById('skip').addEventListener('click',function(){if(!busy){busy=true;go('skip')}});
document.getElementById('open').addEventListener('click',async function(){if(busy)return;busy=true;setState('Scegli il file…');try{if('showOpenFilePicker' in window){var hs=await showOpenFilePicker({types:[{description:'Rubrica JSON',accept:{'application/json':['.json']}}]});if(!hs||!hs[0])throw new Error('Nessun file');var f=await hs[0].getFile();await acceptFile(f,hs[0]);}else{busy=false;document.getElementById('fileFallback').click()}}catch(e){busy=false;if(e&&e.name==='AbortError')setState('PRONTO');else setState('Apertura file non riuscita',true)}});
document.getElementById('fileFallback').addEventListener('change',function(){var f=this.files&&this.files[0];if(f){busy=true;acceptFile(f,null)}});

var gsiPromise=null,tokenClient=null;
function loadGsi(){if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();if(gsiPromise)return gsiPromise;gsiPromise=new Promise(function(res,rej){var s=document.createElement('script'),done=false,t=setTimeout(function(){if(!done){done=true;rej(new Error('Timeout Google'))}},9000);s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=function(){if(!done){done=true;clearTimeout(t);res()}};s.onerror=function(){if(!done){done=true;clearTimeout(t);rej(new Error('Google non disponibile'))}};document.head.appendChild(s)});return gsiPromise}
function requestDrive(){tokenClient=google.accounts.oauth2.initTokenClient({client_id:'239044648260-dpn2l35dhjk1md1okn8nc7fob7fqnvrq.apps.googleusercontent.com',scope:'https://www.googleapis.com/auth/drive.file',callback:function(resp){busy=false;if(resp&&resp.access_token){try{sessionStorage.setItem('ktn_launch_drive_token',resp.access_token)}catch(_e){}go('drive')}else setState('Accesso Google Drive non riuscito',true)}});tokenClient.requestAccessToken({prompt:'consent'})}
document.getElementById('drive').addEventListener('click',function(){if(busy)return;busy=true;setState('Preparazione Google Drive…');loadGsi().then(function(){setState('Autorizzazione Google Drive…');try{requestDrive()}catch(e){busy=false;setState('Tocca di nuovo Google Drive',true)}}).catch(function(){busy=false;setState('Google Drive non disponibile. Riprova.',true)})});

/* Il service worker viene aggiornato dopo che il launcher e gia interattivo. */
if('serviceWorker' in navigator&&location.protocol==='https:')setTimeout(function(){navigator.serviceWorker.register('./sw.js?v=7050',{scope:'./'}).catch(function(){})},1200);
})();
</script>
</body>
</html>
